name: Build TEHNOCELL Platform Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-platform.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore persistent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_BASE64 repository secret before building."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tehnocell-platform.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/tehnocell-platform.jks" >> "$GITHUB_ENV"

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android-app assembleDebug --stacktrace -PciVersionCode=${{ github.run_number }}

      - name: Keep APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TEHNOCELL-Platform-v${{ github.run_number }}
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: platform-v1.0.${{ github.run_number }}
          name: TEHNOCELL PLATFORM 1.0.${{ github.run_number }}
          body: |
            Установочный APK TEHNOCELL PLATFORM.
            Приложение открывает актуальную веб-платформу TEHNOCELL.
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
