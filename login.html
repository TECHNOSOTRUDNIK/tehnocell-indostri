<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta name="theme-color" content="#050505">
<title>TEHNOCELL — технические работы</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#050505;color:#f5f5f5;font-family:Inter,Arial,sans-serif}
body{min-height:100svh;display:grid;place-items:center;padding:28px}
main{width:min(100%,560px);text-align:center;padding:44px 28px;border:1px solid #292929;border-radius:26px;background:linear-gradient(145deg,#111,#080808);box-shadow:0 24px 90px #000}
.mark{width:54px;height:54px;margin:0 auto 28px;border:1px solid #777;border-radius:17px;display:grid;place-items:center;font-size:22px;font-weight:800;letter-spacing:-2px}
h1{font-size:clamp(25px,7vw,38px);letter-spacing:.12em;margin:0 0 18px;font-weight:750}
p{color:#b8b8b8;font-size:16px;line-height:1.65;margin:0}
.status{display:inline-flex;align-items:center;gap:9px;margin-top:30px;padding:10px 15px;border:1px solid #333;border-radius:999px;color:#ddd;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;background:#eee;box-shadow:0 0 12px #fff}
</style></head>
<body><main><div class="mark">T</div><h1>TEHNOCELL</h1><p>Сайт временно приостановлен в связи с обновлением систем.<br>Пожалуйста, попробуйте зайти позднее.</p><div class="status"><span class="dot"></span>Техническое обслуживание</div></main></body></html>
