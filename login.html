</style></head><body><div class="container">  <div class="logo">
    TEHNOCELL <span>ID</span>
    <div class="logo-line"></div>
  </div>  <h1>С возвращением</h1>  <p class="subtitle">
    Войдите в свой аккаунт, чтобы продолжить
    пользоваться экосистемой TEHNOCELL.
  </p>  <form id="loginForm"><label for="email">Электронная почта</label>
<input
  id="email"
  type="email"
  placeholder="name@example.com"
  autocomplete="email"
  required
>

<label for="password">Пароль</label>
<input
  id="password"
  type="password"
  placeholder="Введите пароль"
  autocomplete="current-password"
  required
>

<button id="loginButton" type="submit">
  Войти в аккаунт
</button>

<div class="message" id="message" role="status"></div>

  </form>  <div class="register">
    Ещё нет аккаунта?
    <a href="register.html">Зарегистрироваться</a>
  </div>  <div class="footer">
    TEHNOCELL INDOSTRI © 2026
  </div></div><script>
const SUPABASE_URL = "https://jvagiuiregvlrfooxdao.supabase.co";

// Используй свой Publishable key.
// Никогда не вставляй сюда Secret key.
const SUPABASE_KEY = "sb_publishable_BIv_yX4jprXgeEpauZyjtA_lr0Weo8X";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const form = document.getElementById("loginForm");
const button = document.getElementById("loginButton");
const message = document.getElementById("message");

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  button.disabled = true;
  button.textContent = "Выполняется вход...";

  message.style.color = "#777";
  message.textContent = "Проверяем данные аккаунта...";

  const { data, error } = await db.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    message.style.color = "#b3261e";
    message.textContent =
      "Не удалось войти. Проверьте почту и пароль.";

    button.disabled = false;
    button.textContent = "Войти в аккаунт";
    return;
  }

  if (!data.user.email_confirmed_at) {
    await db.auth.signOut();

    message.style.color = "#b3261e";
    message.textContent =
      "Сначала подтвердите электронную почту.";

    button.disabled = false;
    button.textContent = "Войти в аккаунт";
    return;
  }

  message.style.color = "#333";
  message.textContent = "Вход выполнен. Открываем кабинет...";

  window.location.href = "account.html";
});
</script><script src="ennie-everywhere.js?v=ennie201-20261111" defer></script>
