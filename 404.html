<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#090909">
  <title>404 — Страница не найдена | TEHNOCELL</title>
  <link rel="icon" type="image/svg+xml" href="/tehnocell-indostri/tehnocell-icon.svg">
  <style>
    :root{color-scheme:dark;--bg:#090909;--panel:#101010;--line:#292929;--muted:#858585;--white:#f5f5f5}
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--bg)}
    body{margin:0;min-height:100vh;min-height:100svh;background:var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(ellipse at center,#000 10%,transparent 78%)}
    header,main,footer{position:relative;z-index:1}
    header{height:76px;padding:0 clamp(20px,5vw,64px);display:flex;align-items:center;border-bottom:1px solid #1d1d1d}
    .brand{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}
    .mark{width:35px;height:35px;border:1px solid #555;border-radius:9px;display:grid;place-items:center;font-size:19px;font-weight:900}
    .brand-name{font-size:12px;font-weight:900;letter-spacing:1.8px}
    .brand-sub{display:block;margin-top:4px;color:#777;font-size:8px;letter-spacing:2.6px}
    main{flex:1;display:grid;place-items:center;padding:54px 20px 70px}
    .card{width:min(100%,690px);text-align:center;padding:clamp(34px,7vw,72px) clamp(22px,6vw,62px);border:1px solid #292929;border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.012));box-shadow:0 30px 100px rgba(0,0,0,.38);position:relative;overflow:hidden}
    .card:before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.09),transparent 70%);top:-210px;left:calc(50% - 150px);pointer-events:none}
    .eyebrow{font-size:9px;font-weight:800;letter-spacing:3px;color:#888;text-transform:uppercase}
    .code{font-size:clamp(104px,25vw,190px);line-height:.95;font-weight:900;letter-spacing:-.095em;margin:25px 0 18px;background:linear-gradient(180deg,#fff 15%,#777 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
    h1{font-size:clamp(22px,4vw,31px);letter-spacing:-.8px;margin:0 0 14px}
    .message{max-width:420px;margin:0 auto;color:#929292;font-size:14px;line-height:1.8}
    .divider{width:44px;height:1px;background:#555;margin:30px auto}
    .actions{display:flex;justify-content:center;flex-wrap:wrap;gap:11px}
    .button{min-height:48px;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;border:1px solid #3a3a3a;color:#eee;text-decoration:none;font-size:11px;font-weight:800;letter-spacing:.5px;transition:background .2s,border-color .2s,transform .2s}
    .button.primary{background:#f3f3f3;color:#090909;border-color:#f3f3f3}
    .button:hover{transform:translateY(-2px);border-color:#888}
    .button.primary:hover{background:#d9d9d9}
    footer{padding:20px 24px 26px;text-align:center;color:#555;font-size:9px;letter-spacing:1.8px}
    @media(max-width:480px){header{height:66px}.card{border-radius:18px}.message{font-size:13px}.actions{flex-direction:column}.button{width:100%}}
    @media(prefers-reduced-motion:reduce){.button{transition:none}}
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/tehnocell-indostri/" aria-label="TEHNOCELL INDOSTRI — главная">
      <span class="mark">T</span>
      <span class="brand-name">TEHNOCELL<span class="brand-sub">INDOSTRI</span></span>
    </a>
  </header>
  <main>
    <section class="card" aria-labelledby="error-title">
      <div class="eyebrow">СИСТЕМНОЕ СООБЩЕНИЕ · 404</div>
      <div class="code" aria-hidden="true">404</div>
      <h1 id="error-title">Страница не найдена</h1>
      <p class="message">Возможно, адрес указан с ошибкой, страница была перемещена или больше не существует.</p>
      <div class="divider"></div>
      <div class="actions">
        <a class="button primary" href="/tehnocell-indostri/">НА ГЛАВНУЮ</a>
        <a class="button" href="#" id="back-button">ВЕРНУТЬСЯ НАЗАД</a>
      </div>
    </section>
  </main>
  <footer>TEHNOCELL INDOSTRI <span aria-hidden="true">·</span> 404 NOT FOUND</footer>
  <script>
    document.getElementById("back-button").addEventListener("click",function(event){
      event.preventDefault();
      if(document.referrer && new URL(document.referrer).origin===location.origin && history.length>1){history.back();}
      else{location.href="/tehnocell-indostri/";}
    });
  </script>
</body>
</html>
