<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#090909">
  <title>500 — Внутренняя ошибка сервера | TEHNOCELL</title>
  <link rel="icon" type="image/svg+xml" href="/tehnocell-indostri/tehnocell-icon.svg">
  <style>
    :root{color-scheme:dark;--bg:#090909;--white:#f5f5f5}
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--bg)}
    body{margin:0;min-height:100vh;min-height:100svh;background:var(--bg);color:var(--white);font-family:Arial,Helvetica,sans-serif;display:flex;flex-direction:column;overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.027) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.027) 1px,transparent 1px);background-size:46px 46px;mask-image:radial-gradient(ellipse at center,#000 10%,transparent 78%)}
    header,main,footer{position:relative;z-index:1}
    header{height:82px;padding:0 clamp(20px,5vw,68px);display:flex;align-items:center;border-bottom:1px solid #1d1d1d}
    .brand{display:flex;align-items:center;gap:13px;color:inherit;text-decoration:none}
    .mark{width:39px;height:39px;border:1px solid #555;border-radius:10px;display:grid;place-items:center;font-size:20px;font-weight:900}
    .brand-name{font-size:13px;font-weight:900;letter-spacing:1.9px}
    .brand-sub{display:block;margin-top:4px;color:#777;font-size:9px;letter-spacing:2.8px}
    main{flex:1;display:grid;place-items:center;padding:58px 20px 76px}
    .card{width:min(100%,760px);text-align:center;padding:clamp(42px,7.5vw,82px) clamp(24px,7vw,76px);border:1px solid #303030;border-radius:26px;background:linear-gradient(145deg,rgba(255,255,255,.05),rgba(255,255,255,.012));box-shadow:0 32px 110px rgba(0,0,0,.42);position:relative;overflow:hidden}
    .card:before{content:"";position:absolute;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.095),transparent 70%);top:-235px;left:calc(50% - 170px);pointer-events:none}
    .eyebrow{font-size:10px;font-weight:800;letter-spacing:3.3px;color:#929292;text-transform:uppercase}
    .code{font-size:clamp(120px,28vw,220px);line-height:.92;font-weight:900;letter-spacing:-.095em;margin:28px 0 22px;background:linear-gradient(180deg,#fff 15%,#777 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
    h1{font-size:clamp(24px,4.4vw,35px);letter-spacing:-.9px;margin:0 0 17px}
    .message{max-width:490px;margin:0 auto;color:#999;font-size:15px;line-height:1.85}
    .divider{width:50px;height:1px;background:#5a5a5a;margin:35px auto}
    .actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}
    .button{min-height:51px;padding:0 25px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid #414141;color:#eee;text-decoration:none;font-size:12px;font-weight:800;letter-spacing:.6px;transition:background .2s,border-color .2s,transform .2s}
    .button.primary{background:#f3f3f3;color:#090909;border-color:#f3f3f3}
    .button:hover{transform:translateY(-2px);border-color:#888}
    .button.primary:hover{background:#d9d9d9}
    footer{padding:22px 24px 28px;text-align:center;color:#5c5c5c;font-size:10px;letter-spacing:1.9px}
    @media(max-width:480px){header{height:70px}.card{border-radius:20px;padding-top:48px;padding-bottom:48px}.message{font-size:14px}.actions{flex-direction:column}.button{width:100%}}
    @media(prefers-reduced-motion:reduce){.button{transition:none}}
</style>
</head>
<body>
  <header><a class="brand" href="/tehnocell-indostri/" aria-label="TEHNOCELL INDOSTRI — главная"><span class="mark">T</span><span class="brand-name">TEHNOCELL<span class="brand-sub">INDOSTRI</span></span></a></header>
  <main><section class="card" aria-labelledby="error-title">
    <div class="eyebrow">СИСТЕМНОЕ СООБЩЕНИЕ · HTTP 500</div>
    <div class="code" aria-hidden="true">500</div>
    <h1 id="error-title">Внутренняя ошибка сервера</h1>
    <p class="message">Во время обработки запроса произошёл сбой. Попробуйте повторить действие позже.</p>
    <div class="divider"></div>
    <div class="actions"><a class="button primary" href="/tehnocell-indostri/">НА ГЛАВНУЮ</a><a class="button" href="#" id="back-button">ВЕРНУТЬСЯ НАЗАД</a></div>
  </section></main>
  <footer>TEHNOCELL INDOSTRI <span aria-hidden="true">·</span> 500 INTERNAL SERVER ERROR</footer>
  <script>document.getElementById("back-button").addEventListener("click",function(e){e.preventDefault();if(document.referrer&&new URL(document.referrer).origin===location.origin&&history.length>1){history.back()}else{location.href="/tehnocell-indostri/"}});</script>
</body>
</html>
