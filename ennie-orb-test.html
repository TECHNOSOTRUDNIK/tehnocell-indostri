<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#050505">
<title>ENNIE — Living Core</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

.scene {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(ellipse at center,
        #171717 0%,
        #090909 50%,
        #030303 100%);
    overflow: hidden;
}

canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

.header {
    position: absolute;
    top: 45px;
    width: 100%;
    text-align: center;
    font-size: 12px;
    letter-spacing: 8px;
    color: rgba(255,255,255,.55);
    z-index: 3;
}

.status {
    position: absolute;
    bottom: 125px;
    text-align: center;
    width: 100%;
    font-size: 11px;
    letter-spacing: 4px;
    color: rgba(255,255,255,.5);
    z-index: 3;
    transition: .5s;
}

.controls {
    position: absolute;
    bottom: 35px;
    display: flex;
    gap: 8px;
    justify-content: center;
    width: 100%;
    padding: 0 8px;
    z-index: 4;
}

button {
    padding: 12px 13px;
    border-radius: 30px;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.07);
    color: white;
    font-size: 10px;
    letter-spacing: 1px;
}

button.active {
    background: white;
    color: black;
}

@media(max-width:390px) {
    button {
        padding: 10px 9px;
        font-size: 9px;
    }
}
</style>
</head>

<body>

<div class="scene">

    <canvas id="core"></canvas>

    <div class="header">TEHNOCELL AI</div>

    <div class="status" id="status">
        ENNIE IS HERE
    </div>

    <div class="controls">
        <button class="active" data-state="idle">ОЖИДАНИЕ</button>
        <button data-state="listening">СЛУШАЮ</button>
        <button data-state="thinking">ДУМАЮ</button>
        <button data-state="speaking">ОТВЕЧАЮ</button>
    </div>

</div>

<script>
/* =====================================
   ENNIE LIVING CORE
===================================== */

const canvas = document.getElementById("core");
const ctx = canvas.getContext("2d");

let W, H, DPR;
let centerX, centerY;
let coreSize;

function resize() {

    W = window.innerWidth;
    H = window.innerHeight;

    DPR = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = W * DPR;
    canvas.height = H * DPR;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    centerX = W / 2;
    centerY = H / 2 - 10;

    coreSize = Math.min(W * .37, H * .25, 190);
}

window.addEventListener("resize", resize);
resize();

/* =====================================
   ANIMATION SETTINGS
===================================== */

let morph = 0;
let targetMorph = 0;

let transitionStart = 0;
let transitionFrom = 0;

let lastTransformation = performance.now();

let currentState = "idle";

const statusElement = document.getElementById("status");

const STATE_NAMES = {
    idle: "ENNIE IS HERE",
    listening: "I'M LISTENING",
    thinking: "THINKING...",
    speaking: "SPEAKING"
};

/* =====================================
   EASING
===================================== */

function smoothStep(t) {
    return t * t * (3 - 2 * t);
}

function easeInOut(t) {
    return t < .5
        ? 4 * t * t * t
        : 1 - Math.pow(-2 * t + 2, 3) / 2;
}

/* =====================================
   SHAPE GEOMETRY
===================================== */

function circlePoint(a) {

    return {
        x: Math.cos(a),
        y: Math.sin(a)
    };
}

/*
   Rounded heart geometry.
   The bottom is deliberately softened.
*/

function heartPoint(a) {

    const x = 16 * Math.pow(Math.sin(a), 3);

    const y =
        13 * Math.cos(a)
        - 5 * Math.cos(2 * a)
        - 2 * Math.cos(3 * a)
        - Math.cos(4 * a);

    return {
        x: x / 17,
        y: -y / 17
    };
}

function getPoint(a, time, extra = 0) {

    const c = circlePoint(a);
    const h = heartPoint(a);

    let x = c.x + (h.x - c.x) * morph;
    let y = c.y + (h.y - c.y) * morph;

    const breathing =
        Math.sin(time * .0015 + a * 3) * .008;

    const organic =
        Math.sin(a * 5 + time * .0008) * .008;

    const factor = 1 + breathing + organic + extra;

    return {
        x: x * factor,
        y: y * factor
    };
}

function createShape(time, extra = 0) {

    const path = new Path2D();

    const count = 220;

    for (let i = 0; i <= count; i++) {

        const a = (i / count) * Math.PI * 2;

        const p = getPoint(a, time, extra);

        const x = centerX + p.x * coreSize;
        const y = centerY + p.y * coreSize;

        if (i === 0) {
            path.moveTo(x, y);
        } else {
            path.lineTo(x, y);
        }
    }

    path.closePath();

    return path;
}

/* =====================================
   OUTER GLOW
===================================== */

function drawGlow(time) {

    const pulse = Math.sin(time * .0014) * 8;

    const gradient = ctx.createRadialGradient(
        centerX,
        centerY,
        coreSize * .2,
        centerX,
        centerY,
        coreSize * 2.2
    );

    gradient.addColorStop(0, "rgba(255,255,255,.15)");
    gradient.addColorStop(.4, "rgba(255,255,255,.065)");
    gradient.addColorStop(1, "rgba(255,255,255,0)");

    ctx.fillStyle = gradient;

    ctx.beginPath();

    ctx.arc(
        centerX,
        centerY,
        coreSize * 2 + pulse,
        0,
        Math.PI * 2
    );

    ctx.fill();
}

/* =====================================
   WHITE ENERGY BODY
===================================== */

function drawBody(time, path) {

    ctx.save();

    ctx.shadowColor = "rgba(255,255,255,.5)";
    ctx.shadowBlur = 35;

    const gradient = ctx.createRadialGradient(
        centerX - coreSize * .28,
        centerY - coreSize * .35,
        2,
        centerX,
        centerY,
        coreSize * 1.4
    );

    gradient.addColorStop(0, "#ffffff");
    gradient.addColorStop(.55, "#fafafa");
    gradient.addColorStop(.82, "#e8e8e8");
    gradient.addColorStop(1, "#bcbfc7");

    ctx.fillStyle = gradient;
    ctx.fill(path);

    ctx.restore();

    /* INNER LIGHT */

    ctx.save();

    ctx.clip(path);

    const inner = ctx.createRadialGradient(
        centerX - coreSize * .25,
        centerY - coreSize * .3,
        0,
        centerX,
        centerY,
        coreSize * 1.1
    );

    inner.addColorStop(0, "rgba(255,255,255,.95)");
    inner.addColorStop(.55, "rgba(255,255,255,.3)");
    inner.addColorStop(1, "rgba(255,255,255,0)");

    ctx.fillStyle = inner;

    ctx.fillRect(
        centerX - coreSize * 1.5,
        centerY - coreSize * 1.5,
        coreSize * 3,
        coreSize * 3
    );

    ctx.restore();
}

/* =====================================
   FLOWING ENERGY LAYERS
===================================== */

function drawEnergyLayers(time) {

    const layers = 7;

    ctx.save();

    for (let layer = 0; layer < layers; layer++) {

        const phase =
            time * (.00035 + layer * .000035)
            + layer * 1.15;

        const path = new Path2D();

        const count = 180;

        for (let i = 0; i <= count; i++) {

            const a = i / count * Math.PI * 2;

            const flow =
                Math.sin(a * 3 + phase) * .10 +
                Math.sin(a * 5 - phase * 1.3) * .035 +
                Math.cos(a * 2 + phase * .7) * .025;

            const radius = 1 + flow;

            const p = getPoint(a, time);

            const x = centerX + p.x * coreSize * radius;
            const y = centerY + p.y * coreSize * radius;

            if (i === 0) path.moveTo(x,y);
            else path.lineTo(x,y);
        }

        path.closePath();

        ctx.strokeStyle =
            `rgba(255,255,255,${.15 + Math.sin(phase) * .08})`;

        ctx.lineWidth = 1.5 + layer * .35;

        ctx.shadowColor = "rgba(255,255,255,.85)";
        ctx.shadowBlur = 9 + layer * 2;

        ctx.stroke(path);
    }

    ctx.restore();
}

/* =====================================
   MOVING SILK RIBBONS
===================================== */

function drawRibbons(time) {

    ctx.save();

    ctx.globalCompositeOperation = "screen";

    const ribbonCount = 5;

    for (let r = 0; r < ribbonCount; r++) {

        const phase = time * .00045 + r * 1.25;

        ctx.beginPath();

        for (let i = 0; i <= 120; i++) {

            const t = i / 120;

            const angle = t * Math.PI * 2;

            const wave =
                Math.sin(angle * 2 + phase) * .12 +
                Math.sin(angle * 3 - phase * 1.4) * .05;

            const p = getPoint(angle, time);

            const radius = 1 + wave;

            const x = centerX + p.x * coreSize * radius;
            const y = centerY + p.y * coreSize * radius;

            if (i === 0) ctx.moveTo(x,y);
            else ctx.lineTo(x,y);
        }

        const alpha = .15 + Math.sin(phase) * .07;

        ctx.strokeStyle = `rgba(255,255,255,${alpha})`;
        ctx.lineWidth = 3 + r * .8;

        ctx.shadowColor = "white";
        ctx.shadowBlur = 15;

        ctx.stroke();
    }

    ctx.restore();
}

/* =====================================
   PARTICLE SYSTEM
===================================== */

const particles = [];

for (let i = 0; i < 100; i++) {

    particles.push({
        angle: Math.random() * Math.PI * 2,
        distance: .8 + Math.random() * 1.1,
        speed: .0001 + Math.random() * .0005,
        size: .5 + Math.random() * 2.2,
        phase: Math.random() * Math.PI * 2
    });
}

function drawParticles(time) {

    ctx.save();

    for (const p of particles) {

        const angle = p.angle + time * p.speed;

        const distance =
            p.distance +
            Math.sin(time * .001 + p.phase) * .05;

        const x =
            centerX +
            Math.cos(angle) * coreSize * distance;

        const y =
            centerY +
            Math.sin(angle) * coreSize * distance;

        const alpha =
            .2 + (Math.sin(time * .002 + p.phase) + 1) * .3;

        ctx.beginPath();

        ctx.arc(x, y, p.size, 0, Math.PI * 2);

        ctx.fillStyle = `rgba(255,255,255,${alpha})`;

        ctx.shadowColor = "white";
        ctx.shadowBlur = 12;

        ctx.fill();
    }

    ctx.restore();
}

/* =====================================
   LIGHT SPARKS
===================================== */

function drawSparks(time) {

    ctx.save();

    for (let i = 0; i < 12; i++) {

        const phase = time * .001 + i * 2.1;

        const angle = phase * .7;

        const distance =
            coreSize * (1.1 + Math.sin(phase) * .15);

        const x = centerX + Math.cos(angle) * distance;
        const y = centerY + Math.sin(angle) * distance;

        const size = 2 + Math.sin(phase * 2) * 1.2;

        ctx.beginPath();

        ctx.arc(x, y, size, 0, Math.PI * 2);

        ctx.fillStyle = "rgba(255,255,255,.9)";
        ctx.shadowColor = "white";
        ctx.shadowBlur = 20;

        ctx.fill();
    }

    ctx.restore();
}

/* =====================================
   TRANSFORMATION FLASH
===================================== */

let flash = 0;

function drawFlash() {

    if (flash <= 0) return;

    ctx.fillStyle = `rgba(255,255,255,${flash * .12})`;

    ctx.fillRect(0,0,W,H);

    flash *= .91;

    if (flash < .01) flash = 0;
}

/* =====================================
   MORPH ENGINE
===================================== */

function transformTo(value, time) {

    if (targetMorph === value) return;

    transitionFrom = morph;
    targetMorph = value;

    transitionStart = time;

    flash = 1;
}

function updateMorph(time) {

    if (!transitionStart) return;

    const progress = Math.min(
        (time - transitionStart) / 2400,
        1
    );

    const eased = easeInOut(progress);

    morph =
        transitionFrom +
        (targetMorph - transitionFrom) * eased;

    if (progress >= 1) {
        morph = targetMorph;
        transitionStart = 0;
    }
}

/* =====================================
   AUTOMATIC HEART TRANSFORMATION
===================================== */

function automaticTransformation(time) {

    if (time - lastTransformation > 9000) {

        transformTo(targetMorph < .5 ? 1 : 0, time);

        lastTransformation = time;
    }
}

/* =====================================
   MAIN RENDER LOOP
===================================== */

function render(time) {

    ctx.clearRect(0,0,W,H);

    updateMorph(time);

    automaticTransformation(time);

    drawGlow(time);

    const path = createShape(time);

    drawBody(time, path);

    drawEnergyLayers(time);

    drawRibbons(time);

    /*
       IMPORTANT:
       The heart has no internal stripe.
       It is represented only by the
       flowing white energy layers.
    */

    drawParticles(time);

    drawSparks(time);

    drawFlash();

    requestAnimationFrame(render);
}

requestAnimationFrame(render);

/* =====================================
   STATES
===================================== */

document.querySelectorAll("[data-state]").forEach(button => {

    button.addEventListener("click", () => {

        currentState = button.dataset.state;

        document.querySelectorAll("button").forEach(btn => {
            btn.classList.remove("active");
        });

        button.classList.add("active");

        statusElement.textContent =
            STATE_NAMES[currentState];

        if (currentState === "listening") {
            transformTo(0, performance.now());
        }

        if (currentState === "speaking") {
            transformTo(1, performance.now());
        }
    });

});

</script>

</body>
</html>
