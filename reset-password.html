<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новый пароль — TEHNOCELL ID</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#f1f1f1;color:#111;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;padding:22px}
.container{width:100%;max-width:430px;background:#fff;border:1px solid #e5e5e5;border-radius:18px;padding:38px 30px;box-shadow:0 12px 45px rgba(0,0,0,.045)}
.logo{text-align:center;font-size:21px;font-weight:800;letter-spacing:2px;margin-bottom:38px}.logo span{font-weight:400;color:#777}.line{width:35px;height:2px;background:#111;margin:15px auto 0}
h1{text-align:center;font-size:25px;margin-bottom:10px}.subtitle{text-align:center;color:#858585;font-size:13px;line-height:1.6;margin-bottom:30px}
label{display:block;font-size:12px;font-weight:700;margin-bottom:9px}
input{width:100%;padding:15px;border:1px solid #dedede;border-radius:9px;background:#fafafa;font-size:14px;color:#111;margin-bottom:20px;outline:none}
input:focus{border-color:#111;background:#fff}
button{width:100%;padding:15px;border:1px solid #111;border-radius:9px;background:#111;color:#fff;font-size:14px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.message{font-size:13px;line-height:1.55;margin-top:16px;text-align:center;overflow-wrap:anywhere}
.back{text-align:center;margin-top:25px;font-size:13px}a{color:#111;text-decoration:none;font-weight:700;border-bottom:1px solid #aaa;padding-bottom:2px}
.footer{text-align:center;color:#aaa;font-size:10px;margin-top:38px;letter-spacing:1.5px}
[hidden]{display:none!important}
@media(max-width:400px){.container{padding:32px 22px}h1{font-size:23px}}
</style>
<link rel="stylesheet" href="new-year-2026.css?v=2026-11-26">
</head>
<body>
<div class="tc-ny-overlay tc-ny-login" aria-hidden="true"></div>
<main class="container">
<div class="logo">TEHNOCELL <span>ID</span><div class="line"></div></div>
<h1>Новый пароль</h1>
<p class="subtitle" id="intro">Проверяем ссылку восстановления...</p>
<form id="passwordForm" hidden>
<label for="password">Новый пароль</label>
<input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="Не менее 8 символов" required>
<label for="confirmPassword">Повторите новый пароль</label>
<input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Введите пароль ещё раз" required>
<button id="saveButton" type="submit">Сохранить новый пароль</button>
</form>
<div class="message" id="message" role="status" aria-live="polite"></div>
<div class="back"><a href="login.html">Перейти ко входу</a></div>
<div class="footer">TEHNOCELL INDOSTRI © 2026</div>
</main>
<script>
const SUPABASE_URL="https://jvagiuiregvlrfooxdao.supabase.co";
const SUPABASE_KEY="sb_publishable_BIv_yX4jprXgeEpauZyjtA_lr0Weo8X";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const form=document.getElementById("passwordForm");
const intro=document.getElementById("intro");
const message=document.getElementById("message");
const button=document.getElementById("saveButton");
let recoveryReady=false;
function showRecovery(){
 recoveryReady=true;
 intro.textContent="Ссылка подтверждена. Придумайте новый пароль для своего аккаунта.";
 form.hidden=false;
 message.textContent="";
}
db.auth.onAuthStateChange((event,session)=>{
 if(event==="PASSWORD_RECOVERY" && session){showRecovery();}
});
(async()=>{
 const {data:{session},error}=await db.auth.getSession();
 if(!recoveryReady && session && (location.hash.includes("type=recovery") || sessionStorage.getItem("tc_password_recovery")==="1")){
  showRecovery();
 }else if(!recoveryReady){
  intro.textContent="Ссылка недействительна или уже истекла. Запросите новую ссылку восстановления.";
  message.style.color="#b3261e";
 }
})();
form.addEventListener("submit",async(event)=>{
 event.preventDefault();
 if(!recoveryReady)return;
 const password=document.getElementById("password").value;
 const confirm=document.getElementById("confirmPassword").value;
 if(password.length<8){message.style.color="#b3261e";message.textContent="Пароль должен содержать не менее 8 символов.";return;}
 if(password!==confirm){message.style.color="#b3261e";message.textContent="Пароли не совпадают.";return;}
 button.disabled=true;button.textContent="Сохраняем...";
 try{
  const {error}=await db.auth.updateUser({password});
  if(error)throw error;
  message.style.color="#222";
  message.textContent="Пароль успешно изменён. Теперь можно войти с новым паролем.";
  form.hidden=true;intro.textContent="Готово! Доступ к аккаунту восстановлен.";
  await db.auth.signOut();
 }catch(error){
  message.style.color="#b3261e";
  message.textContent="Не удалось изменить пароль. Возможно, ссылка истекла. Запросите новую.";
  button.disabled=false;button.textContent="Сохранить новый пароль";
 }
});
</script>
</body>
</html>
