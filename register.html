<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEHNOCELL ID — Регистрация</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    padding: 25px 16px;
    background: #f4f4f4;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

.container {
    width: 100%;
    max-width: 430px;
    padding: 36px 28px;
    background: #080808;
    border-radius: 18px;
    border: 1px solid #222;
    box-shadow: 0 0 25px rgba(0,0,0,.12);
}

.logo {
    text-align: center;
    font-size: 27px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #fff;
    text-shadow: 0 0 7px rgba(255,255,255,.65),
                 0 0 18px rgba(255,255,255,.25);
}

.logo span {
    color: #a5e6bd;
    text-shadow: 0 0 8px rgba(165,230,189,.8),
                 0 0 20px rgba(165,230,189,.4);
}

.subtitle {
    text-align: center;
    color: #aaa;
    font-size: 13px;
    margin-top: 9px;
    margin-bottom: 34px;
}

h2 {
    font-size: 23px;
    margin-bottom: 25px;
    text-shadow: 0 0 12px rgba(255,255,255,.25);
}

label {
    display: block;
    font-size: 14px;
    color: #ddd;
    margin: 17px 0 8px;
}

.input-wrap {
    position: relative;
}

input {
    width: 100%;
    padding: 14px;
    background: #171717;
    border: 1px solid #383838;
    border-radius: 8px;
    color: white;
    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #a5e6bd;
    box-shadow: 0 0 10px rgba(165,230,189,.15);
}

.password-input {
    padding-right: 48px;
}

.toggle-password {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 34px;
    height: 34px;
    margin: 0;
    padding: 0;
    background: transparent;
    color: #aaa;
    border: none;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.toggle-password:hover {
    color: #a5e6bd;
}

button[type="submit"] {
    width: 100%;
    padding: 15px;
    margin-top: 27px;
    background: #a5e6bd;
    color: #080808;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

button[type="submit"]:hover {
    box-shadow: 0 0 18px rgba(165,230,189,.35);
}

button:disabled {
    opacity: .6;
}

.message {
    margin-top: 17px;
    text-align: center;
    font-size: 14px;
    line-height: 1.5;
}

.links {
    text-align: center;
    margin-top: 25px;
    color: #aaa;
    font-size: 14px;
}

a {
    color: #a5e6bd;
    text-decoration: none;
    text-shadow: 0 0 8px rgba(165,230,189,.25);
}

a:hover {
    text-decoration: underline;
}

.footer {
    text-align: center;
    margin-top: 27px;
    color: #666;
    font-size: 11px;
    letter-spacing: 1px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">TEHNOCELL <span>ID</span></div>
    <div class="subtitle">Единый аккаунт экосистемы TEHNOCELL</div>

    <h2>Создание аккаунта</h2>

    <form id="registerForm">

        <label for="name">Имя пользователя</label>
        <input id="name" type="text"
        placeholder="Как к вам обращаться" required>

        <label for="email">Электронная почта</label>
        <input id="email" type="email"
        placeholder="example@mail.com" required>

        <label for="password">Пароль</label>
        <div class="input-wrap">
            <input id="password" class="password-input"
            type="password" placeholder="Минимум 8 символов"
            minlength="8" required>
            <button class="toggle-password" type="button"
            data-target="password" aria-label="Показать пароль">👁</button>
        </div>

        <label for="confirmPassword">Повторите пароль</label>
        <div class="input-wrap">
            <input id="confirmPassword" class="password-input"
            type="password" placeholder="Повторите пароль" required>
            <button class="toggle-password" type="button"
            data-target="confirmPassword" aria-label="Показать пароль">👁</button>
        </div>

        <button id="submitButton" type="submit">
            Создать аккаунт
        </button>

    </form>

    <div class="message" id="message" aria-live="polite"></div>

    <div class="links">
        Уже есть аккаунт?
        <a href="login.html">Войти</a>
    </div>

    <div class="footer">
        TEHNOCELL INDOSTRI © 2026
    </div>

</div>

<script>
const SUPABASE_URL = "ВСТАВЬ_API_URL";
const SUPABASE_KEY = "ВСТАВЬ_PUBLISHABLE_KEY";

const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// Показать или скрыть пароль
document.querySelectorAll(".toggle-password").forEach(button => {
    button.addEventListener("click", () => {
        const input = document.getElementById(button.dataset.target);
        const visible = input.type === "password";

        input.type = visible ? "text" : "password";
        button.textContent = visible ? "🙈" : "👁";
        button.setAttribute(
            "aria-label",
            visible ? "Скрыть пароль" : "Показать пароль"
        );
    });
});

const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const submitButton = document.getElementById("submitButton");

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword =
        document.getElementById("confirmPassword").value;

    message.style.color = "#ff7777";

    if (name.length < 2) {
        message.textContent = "Имя должно содержать минимум 2 символа.";
        return;
    }

    if (password.length < 8) {
        message.textContent = "Пароль должен содержать минимум 8 символов.";
        return;
    }

    if (password !== confirmPassword) {
        message.textContent = "Пароли не совпадают.";
        return;
    }

    submitButton.disabled = true;
    submitButton.textContent = "Создаём аккаунт...";
    message.textContent = "";

    try {
        const { error } = await client.auth.signUp({
            email,
            password,
            options: {
                data: { display_name: name },
                emailRedirectTo:
                "https://technosotrudnik.github.io/tehnocell-indostri/account.html"
            }
        });

        if (error) throw error;

        message.style.color = "#a5e6bd";
        message.textContent =
            "Регистрация почти завершена! Проверьте почту и подтвердите адрес.";

        form.reset();

    } catch (error) {
        message.style.color = "#ff7777";
        message.textContent = error.message;

    } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Создать аккаунт";
    }
});
</script>

</body>
</html>
