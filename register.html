<!DOCTYPE html><html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация — TEHNOCELL ID</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;background:#f2f2f2;color:#111;
  font-family:Arial,sans-serif;display:flex;
  justify-content:center;align-items:center;padding:22px
}
.container{
  width:100%;max-width:440px;background:#fff;
  border:1px solid #e5e5e5;border-radius:18px;
  padding:38px 30px;box-shadow:0 12px 45px rgba(0,0,0,.04)
}
.logo{text-align:center;font-size:21px;font-weight:800;letter-spacing:2px;margin-bottom:40px}
.logo span{color:#888;font-weight:400}
.line{width:35px;height:2px;background:#111;margin:14px auto 0}
h1{text-align:center;font-size:27px;margin-bottom:10px}
.subtitle{text-align:center;color:#888;font-size:13px;line-height:1.6;margin-bottom:30px}
label{display:block;font-size:12px;font-weight:bold;margin-bottom:9px}
input{
  width:100%;padding:15px;border:1px solid #dedede;
  border-radius:9px;background:#fafafa;font-size:14px;
  margin-bottom:19px;outline:none
}
input:focus{border-color:#111;background:#fff}
button{
  width:100%;padding:15px;border:1px solid #111;
  border-radius:9px;background:#111;color:#fff;
  font-size:14px;font-weight:bold;cursor:pointer
}
button:disabled{opacity:.6}
.message{font-size:13px;line-height:1.5;text-align:center;margin-top:15px;overflow-wrap:anywhere}
.bottom{text-align:center;color:#888;font-size:13px;margin-top:26px}
a{color:#111;text-decoration:none;font-weight:bold;border-bottom:1px solid #aaa;padding-bottom:2px}
.footer{text-align:center;color:#aaa;font-size:10px;margin-top:40px;letter-spacing:1.5px}
@media(max-width:400px){.container{padding:32px 22px}h1{font-size:24px}}
</style>
</head>
<body>
<div class="container">
  <div class="logo">TEHNOCELL <span>ID</span><div class="line"></div></div>
  <h1>Создать аккаунт</h1>
  <p class="subtitle">Присоединяйтесь к экосистеме TEHNOCELL INDOSTRI.</p>  <form id="registerForm">
    <label for="name">Имя пользователя</label>
    <input id="name" type="text" placeholder="Как к вам обращаться" autocomplete="name" required><label for="email">Электронная почта</label>
<input id="email" type="email" placeholder="name@example.com" autocomplete="email" required>

<label for="password">Пароль</label>
<input id="password" type="password" placeholder="Минимум 6 символов" autocomplete="new-password" required>

<label for="confirmPassword">Повторите пароль</label>
<input id="confirmPassword" type="password" placeholder="Введите пароль ещё раз" autocomplete="new-password" required>

<button id="registerButton" type="submit">Создать аккаунт</button>
<div class="message" id="message" role="status"></div>

  </form>  <div class="bottom">Уже есть аккаунт? <a href="login.html">Войти</a></div>
  <div class="footer">TEHNOCELL INDOSTRI © 2026</div>
</div><script>
const SUPABASE_URL="https://jvagiuiregvlrfooxdao.supabase.co";
const SUPABASE_KEY="sb_publishable_BIv_yX4jprXgeEpauZyjtA_lr0Weo8X";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const form=document.getElementById("registerForm");
const button=document.getElementById("registerButton");
const message=document.getElementById("message");

form.addEventListener("submit",async function(e){
  e.preventDefault();

  const name=document.getElementById("name").value.trim();
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const confirm=document.getElementById("confirmPassword").value;

  if(name.length<2){
    message.style.color="#b3261e";
    message.textContent="Имя должно содержать минимум 2 символа.";
    return;
  }

  if(password.length<6){
    message.style.color="#b3261e";
    message.textContent="Пароль должен содержать минимум 6 символов.";
    return;
  }

  if(password!==confirm){
    message.style.color="#b3261e";
    message.textContent="Пароли не совпадают.";
    return;
  }

  button.disabled=true;
  button.textContent="Создаём аккаунт...";
  message.style.color="#777";
  message.textContent="Пожалуйста, подождите...";

  try{
    const {data,error}=await db.auth.signUp({
      email,
      password,
      options:{
        data:{display_name:name},
        emailRedirectTo:"https://technosotrudnik.github.io/tehnocell-indostri/account.html"
      }
    });

    if(error) throw error;

    message.style.color="#222";
    message.textContent=data.session
      ?"Аккаунт создан! Открываем личный кабинет..."
      :"Аккаунт создан! Проверьте почту и подтвердите регистрацию.";

    if(data.session){
      setTimeout(()=>location.href="account.html",1200);
    }else{
      button.textContent="Ожидаем подтверждения";
    }
  }catch(error){
    message.style.color="#b3261e";
    message.textContent="Ошибка: "+error.message;
    button.disabled=false;
    button.textContent="Создать аккаунт";
  }
});
</script><script src="ennie-everywhere.js?v=mini-nav-20261111" defer></script>
</body>
</html>
