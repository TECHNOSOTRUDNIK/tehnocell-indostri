<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f4f4f4">
<title>TEHNOCELL ID — Регистрация</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 25px 16px;
    background: #f4f4f4;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

.container {
    width: 100%;
    max-width: 430px;
    padding: 36px 28px;
    background: #080808;
    border-radius: 18px;
    border: 1px solid #222;
}

.logo {
    text-align: center;
    font-size: 27px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #fff;
}

.logo span {
    color: #a5e6bd;
}

.subtitle {
    text-align: center;
    color: #999;
    font-size: 13px;
    margin-top: 9px;
    margin-bottom: 34px;
}

h2 {
    font-size: 23px;
    font-weight: 600;
    margin-bottom: 25px;
}

label {
    display: block;
    font-size: 14px;
    color: #ddd;
    margin: 17px 0 8px;
}

.input-wrap {
    position: relative;
}

input {
    width: 100%;
    padding: 14px;
    background: #171717;
    border: 1px solid #383838;
    border-radius: 8px;
    color: white;
    font-size: 15px;
    outline: none;
    transition: border-color .2s;
}

input:focus {
    border-color: #a5e6bd;
}

.password-input {
    padding-right: 48px;
}

.toggle-password {
    position: absolute;
    right: 7px;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    margin: 0;
    padding: 8px;
    background: transparent;
    border: none;
    color: #aaa;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color .2s;
}

.toggle-password svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.toggle-password:hover {
    color: #fff;
}

.toggle-password:focus-visible {
    outline: 1px solid #a5e6bd;
    border-radius: 5px;
}

.submit-button {
    width: 100%;
    padding: 15px;
    margin-top: 27px;
    background: #a5e6bd;
    color: #080808;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: background .2s;
}

.submit-button:hover {
    background: #8ed8aa;
}

.submit-button:disabled {
    opacity: .6;
    cursor: wait;
}

.message {
    margin-top: 17px;
    text-align: center;
    font-size: 14px;
    line-height: 1.5;
}

.links {
    text-align: center;
    margin-top: 25px;
    color: #aaa;
    font-size: 14px;
}

a {
    color: #a5e6bd;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

.footer {
    text-align: center;
    margin-top: 27px;
    color: #666;
    font-size: 11px;
    letter-spacing: 1px;
}

@media (max-width: 380px) {
    .container {
        padding: 30px 20px;
    }

    .logo {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">TEHNOCELL <span>ID</span></div>

    <div class="subtitle">
        Единый аккаунт экосистемы TEHNOCELL
    </div>

    <h2>Создание аккаунта</h2>

    <form id="registerForm">

        <label for="name">Имя пользователя</label>
        <input
            id="name"
            type="text"
            placeholder="Как к вам обращаться"
            autocomplete="nickname"
            maxlength="40"
            required
        >

        <label for="email">Электронная почта</label>
        <input
            id="email"
            type="email"
            placeholder="example@mail.com"
            autocomplete="email"
            required
        >

        <label for="password">Пароль</label>

        <div class="input-wrap">
            <input
                id="password"
                class="password-input"
                type="password"
                placeholder="Минимум 8 символов"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button
                class="toggle-password"
                type="button"
                data-target="password"
                aria-label="Показать пароль"
                aria-pressed="false"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
            </button>
        </div>

        <label for="confirmPassword">Повторите пароль</label>

        <div class="input-wrap">
            <input
                id="confirmPassword"
                class="password-input"
                type="password"
                placeholder="Повторите пароль"
                autocomplete="new-password"
                required
            >

            <button
                class="toggle-password"
                type="button"
                data-target="confirmPassword"
                aria-label="Показать пароль"
                aria-pressed="false"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
            </button>
        </div>

        <button id="submitButton" class="submit-button" type="submit">
            Создать аккаунт
        </button>

    </form>

    <div class="message" id="message" aria-live="polite"></div>

    <div class="links">
        Уже есть аккаунт?
        <a href="login.html">Войти</a>
    </div>

    <div class="footer">
        TEHNOCELL INDOSTRI © 2026
    </div>

</div>

<script>
const SUPABASE_URL = "https://jvagiuiregvlrfooxdao.supabase.co";
const SUPABASE_KEY = "sb_publishable_BIv_yX4jprXgeEpauZyjtA_lr0Weo8X";

const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

// Показ и скрытие пароля
const eyeOpen = `
<svg viewBox="0 0 24 24" aria-hidden="true">
<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
<circle cx="12" cy="12" r="3"/>
</svg>`;

const eyeClosed = `
<svg viewBox="0 0 24 24" aria-hidden="true">
<path d="M3 3l18 18"/>
<path d="M10.6 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a14 14 0 0 1-3.2 3.8"/>
<path d="M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7c1.2 0 2.3-.2 3.3-.6"/>
<path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
</svg>`;

document.querySelectorAll(".toggle-password").forEach(button => {
    button.addEventListener("click", () => {
        const input = document.getElementById(button.dataset.target);
        const visible = input.type === "password";

        input.type = visible ? "text" : "password";
        button.innerHTML = visible ? eyeClosed : eyeOpen;
        button.setAttribute("aria-pressed", String(visible));
        button.setAttribute(
            "aria-label",
            visible ? "Скрыть пароль" : "Показать пароль"
        );
    });
});

// Регистрация
const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const submitButton = document.getElementById("submitButton");

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword =
        document.getElementById("confirmPassword").value;

    message.style.color = "#ff7777";
    message.textContent = "";

    if (name.length < 2) {
        message.textContent =
            "Имя должно содержать минимум 2 символа.";
        return;
    }

    if (password.length < 8) {
        message.textContent =
            "Пароль должен содержать минимум 8 символов.";
        return;
    }

    if (password !== confirmPassword) {
        message.textContent = "Пароли не совпадают.";
        return;
    }

    submitButton.disabled = true;
    submitButton.textContent = "Создаём аккаунт...";

    try {
        const { error } = await client.auth.signUp({
            email,
            password,
            options: {
                data: {
                    display_name: name
                },
                emailRedirectTo:
                    "https://technosotrudnik.github.io/tehnocell-indostri/account.html"
            }
        });

        if (error) throw error;

        message.style.color = "#a5e6bd";
        message.textContent =
            "Проверьте электронную почту и подтвердите регистрацию.";

        form.reset();

        document.querySelectorAll(".toggle-password").forEach(button => {
            button.innerHTML = eyeOpen;
            button.setAttribute("aria-pressed", "false");
            button.setAttribute("aria-label", "Показать пароль");
        });

    } catch (error) {
        message.style.color = "#ff7777";
        message.textContent = error.message;

    } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Создать аккаунт";
    }
});
</script>

</body>
</html>
