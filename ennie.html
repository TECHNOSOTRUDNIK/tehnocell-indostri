<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>ENNIE — TEHNOCELL AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --bg:#090909;
  --panel:#111111;
  --panel2:#171717;
  --text:#f5f5f5;
  --muted:#858585;
  --border:#ffffff12;
  --accent:#ffffff;
  --input:#151515;
  --shadow:#00000055;
}

body.light {
  --bg:#f5f5f5;
  --panel:#ffffff;
  --panel2:#eeeeee;
  --text:#171717;
  --muted:#777777;
  --border:#00000013;
  --accent:#111111;
  --input:#eeeeee;
  --shadow:#00000012;
}

* {
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body {
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,sans-serif;
  overflow:hidden;
}

button,input,textarea {
  font:inherit;
}

button {
  color:inherit;
  cursor:pointer;
}

#app {
  width:100%;
  height:100dvh;
  display:flex;
  overflow:hidden;
  background:var(--bg);
}

/* SIDEBAR */

.sidebar {
  width:275px;
  flex-shrink:0;
  height:100%;
  background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:20px 15px;
  transition:transform .3s ease;
  z-index:20;
}

.brand {
  display:flex;
  align-items:center;
  gap:11px;
  padding:5px 8px 25px;
}

.brand-symbol {
  width:32px;
  height:32px;
  border:1px solid var(--text);
  border-radius:11px;
  display:grid;
  place-items:center;
  font-size:15px;
  font-weight:700;
}

.brand-name {
  font-size:17px;
  font-weight:700;
  letter-spacing:2px;
}

.brand-sub {
  font-size:9px;
  color:var(--muted);
  letter-spacing:2px;
  margin-top:4px;
}

.new-chat {
  width:100%;
  border:1px solid var(--border);
  background:var(--panel2);
  border-radius:13px;
  padding:14px;
  text-align:left;
  font-size:13px;
  margin-bottom:24px;
}

.new-chat span {
  margin-right:9px;
  font-size:17px;
}

.side-label {
  color:var(--muted);
  font-size:10px;
  letter-spacing:1.5px;
  padding:0 9px 12px;
}

.chat-list {
  flex:1;
  overflow-y:auto;
}

.chat-item {
  width:100%;
  padding:12px 10px;
  margin-bottom:4px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:var(--muted);
  text-align:left;
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.chat-item.active,
.chat-item:active {
  background:var(--panel2);
  color:var(--text);
}

.sidebar-bottom {
  border-top:1px solid var(--border);
  padding-top:12px;
}

.side-button {
  width:100%;
  border:0;
  background:transparent;
  padding:13px 10px;
  text-align:left;
  color:var(--muted);
  font-size:12px;
  border-radius:10px;
}

.side-button:hover {
  background:var(--panel2);
  color:var(--text);
}

/* MAIN */

.main {
  flex:1;
  min-width:0;
  height:100%;
  display:flex;
  flex-direction:column;
  position:relative;
}

.topbar {
  height:65px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 23px;
  border-bottom:1px solid var(--border);
}

.top-title {
  font-size:13px;
  font-weight:600;
  letter-spacing:.5px;
}

.top-actions {
  display:flex;
  gap:9px;
}

.icon-button {
  width:38px;
  height:38px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--panel);
  display:grid;
  place-items:center;
  font-size:16px;
}

.mobile-brand {
  display:none;
}

/* SCREENS */

.screen {
  display:none;
  flex:1;
  min-height:0;
  overflow-y:auto;
}

.screen.active {
  display:flex;
  flex-direction:column;
}

/* HOME */

.home-screen {
  align-items:center;
  justify-content:center;
  padding:20px 18px 35px;
  text-align:center;
}

.greeting {
  font-size:clamp(24px,5vw,34px);
  font-weight:500;
  letter-spacing:-1.4px;
  margin:0 0 9px;
}

.greeting-sub {
  color:var(--muted);
  font-size:12px;
  line-height:1.7;
  max-width:280px;
}

/* ORB */

.orb-area {
  width:min(270px,72vw);
  height:min(270px,72vw);
  position:relative;
  display:grid;
  place-items:center;
  margin:15px 0 18px;
  cursor:pointer;
  touch-action:manipulation;
}

#orbCanvas {
  width:100%;
  height:100%;
  overflow:visible;
}

.orb-halo {
  position:absolute;
  inset:10%;
  border-radius:50%;
  background:radial-gradient(
    circle,
    #ffffff13 0%,
    #ffffff06 45%,
    transparent 72%
  );
  filter:blur(18px);
  pointer-events:none;
  animation:halo 4s ease-in-out infinite;
}

@keyframes halo {
  0%,100% { transform:scale(.9); opacity:.5; }
  50% { transform:scale(1.12); opacity:1; }
}

.orb-hint {
  color:var(--muted);
  font-size:10px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  margin-bottom:27px;
}

.quick-actions {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:9px;
}

.quick-action {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:30px;
  padding:11px 15px;
  font-size:11px;
  color:var(--muted);
  transition:.2s;
}

.quick-action:active {
  transform:scale(.96);
  color:var(--text);
}

/* CHAT */

.chat-screen {
  position:relative;
}

.messages {
  flex:1;
  overflow-y:auto;
  padding:25px max(18px,calc((100% - 760px)/2));
  display:flex;
  flex-direction:column;
  gap:19px;
  scroll-behavior:smooth;
}

.message {
  max-width:min(82%,620px);
  padding:13px 16px;
  border-radius:18px;
  font-size:13px;
  line-height:1.65;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  animation:messageIn .3s ease;
}

@keyframes messageIn {
  from { opacity:0; transform:translateY(9px); }
  to { opacity:1; transform:translateY(0); }
}

.message.user {
  align-self:flex-end;
  background:var(--text);
  color:var(--bg);
  border-bottom-right-radius:5px;
}

.message.assistant {
  align-self:flex-start;
  background:var(--panel2);
  border:1px solid var(--border);
  border-bottom-left-radius:5px;
}

.message.typing {
  color:var(--muted);
  letter-spacing:3px;
}

.chat-composer {
  flex-shrink:0;
  padding:12px 17px max(16px,env(safe-area-inset-bottom));
  background:var(--bg);
}

.composer-inner {
  max-width:780px;
  margin:auto;
  display:flex;
  align-items:flex-end;
  gap:9px;
  padding:9px;
  background:var(--input);
  border:1px solid var(--border);
  border-radius:19px;
}

#messageInput {
  flex:1;
  min-width:0;
  max-height:130px;
  resize:none;
  border:0;
  outline:0;
  color:var(--text);
  background:transparent;
  padding:10px 8px;
  font-size:13px;
}

#messageInput::placeholder {
  color:var(--muted);
}

.send-button {
  width:39px;
  height:39px;
  flex-shrink:0;
  border:0;
  border-radius:13px;
  background:var(--text);
  color:var(--bg);
  font-size:17px;
  display:grid;
  place-items:center;
}

.send-button:disabled {
  opacity:.35;
}

.composer-tools {
  display:flex;
  gap:7px;
  align-items:center;
}

.tool-button {
  width:37px;
  height:37px;
  border:0;
  background:transparent;
  color:var(--muted);
  border-radius:12px;
  font-size:16px;
}

/* SETTINGS */

.settings-screen {
  padding:25px 18px 50px;
}

.settings-content {
  width:100%;
  max-width:650px;
  margin:0 auto;
}

.settings-heading {
  font-size:25px;
  font-weight:600;
  margin:5px 0 23px;
  letter-spacing:-.8px;
}

.settings-section {
  margin-bottom:25px;
}

.section-title {
  font-size:10px;
  letter-spacing:1.6px;
  color:var(--muted);
  margin:0 0 11px 4px;
  text-transform:uppercase;
}

.account-card {
  width:100%;
  display:flex;
  align-items:center;
  gap:14px;
  padding:17px;
  border:1px solid var(--border);
  border-radius:17px;
  background:var(--panel);
  text-align:left;
}

.account-avatar {
  width:53px;
  height:53px;
  flex-shrink:0;
  border-radius:50%;
  background:var(--panel2);
  border:1px solid var(--border);
  display:grid;
  place-items:center;
  overflow:hidden;
  font-size:19px;
}

.account-avatar img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.account-info {
  flex:1;
  min-width:0;
}

.account-name {
  font-size:14px;
  font-weight:600;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.account-id {
  color:var(--muted);
  font-size:10px;
  margin-top:6px;
}

.account-status {
  color:#79c995;
  font-size:10px;
  margin-top:5px;
}

.account-arrow {
  color:var(--muted);
  font-size:20px;
}

.setting-row {
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:16px;
  border:1px solid var(--border);
  border-radius:13px;
  background:var(--panel);
  margin-bottom:8px;
  text-align:left;
}

.setting-row-title {
  font-size:12px;
  font-weight:500;
}

.setting-row-desc {
  color:var(--muted);
  font-size:10px;
  margin-top:5px;
}

.setting-control {
  color:var(--muted);
  font-size:12px;
}

.toggle {
  width:39px;
  height:23px;
  border-radius:20px;
  background:var(--panel2);
  border:1px solid var(--border);
  position:relative;
  transition:.2s;
}

.toggle::after {
  content:"";
  position:absolute;
  top:3px;
  left:3px;
  width:15px;
  height:15px;
  border-radius:50%;
  background:var(--muted);
  transition:.2s;
}

.toggle.on {
  background:var(--text);
}

.toggle.on::after {
  left:19px;
  background:var(--bg);
}

/* NOTIFICATIONS */

.toast-container {
  position:fixed;
  z-index:1000;
  top:max(14px,env(safe-area-inset-top));
  left:50%;
  transform:translateX(-50%);
  width:min(420px,calc(100vw - 24px));
  display:flex;
  flex-direction:column;
  gap:8px;
  pointer-events:none;
}

.toast {
  padding:14px 16px;
  border:1px solid var(--border);
  border-radius:15px;
  background:var(--panel);
  color:var(--text);
  box-shadow:0 12px 35px var(--shadow);
  font-size:12px;
  opacity:0;
  transform:translateY(-15px) scale(.97);
  transition:.35s cubic-bezier(.16,1,.3,1);
  backdrop-filter:blur(20px);
}

.toast.show {
  opacity:1;
  transform:translateY(0) scale(1);
}

/* OVERLAY */

.mobile-overlay {
  display:none;
}

@media(max-width:700px) {
  .sidebar {
    position:fixed;
    top:0;
    bottom:0;
    left:0;
    width:min(300px,85vw);
    transform:translateX(-105%);
    box-shadow:15px 0 50px #00000055;
  }

  .sidebar.open {
    transform:translateX(0);
  }

  .mobile-overlay.show {
    display:block;
    position:fixed;
    inset:0;
    background:#0009;
    z-index:19;
  }

  .topbar {
    height:58px;
    padding:0 13px;
  }

  .mobile-brand {
    display:block;
    font-weight:700;
    letter-spacing:2px;
    font-size:13px;
  }

  .top-title {
    display:none;
  }

  .home-screen {
    padding-top:10px;
  }

  .orb-area {
    width:min(230px,68vw);
    height:min(230px,68vw);
    margin:12px 0;
  }

  .greeting {
    font-size:25px;
  }

  .messages {
    padding:18px 13px;
  }

  .message {
    max-width:88%;
  }

  .chat-composer {
    padding-left:10px;
    padding-right:10px;
  }
}

@media(max-width:380px) {
  .orb-area {
    width:190px;
    height:190px;
  }

  .quick-action {
    padding:9px 12px;
    font-size:10px;
  }
}
</style>
</head>

<body>
<div id="app">

  <div class="mobile-overlay" id="mobileOverlay"></div>

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-symbol">E</div>
      <div>
        <div class="brand-name">ENNIE</div>
        <div class="brand-sub">TEHNOCELL AI</div>
      </div>
    </div>

    <button class="new-chat" id="newChatButton">
      <span>＋</span> Новый диалог
    </button>

    <div class="side-label">ИСТОРИЯ</div>
    <div class="chat-list" id="chatList"></div>

    <div class="sidebar-bottom">
      <button class="side-button" data-screen="home">⌂ Главная</button>
      <button class="side-button" data-screen="settings">⚙ Настройки</button>
    </div>
  </aside>

  <main class="main">

    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="icon-button" id="menuButton">☰</button>
        <div class="mobile-brand">ENNIE</div>
        <div class="top-title" id="topTitle">Главная</div>
      </div>

      <div class="top-actions">
        <button class="icon-button" id="themeButton">◐</button>
        <button class="icon-button" id="settingsButton">⚙</button>
      </div>
    </header>

    <section class="screen home-screen active" id="homeScreen">

      <h1 class="greeting" id="greeting">Привет. Я Энни.</h1>
      <div class="greeting-sub">
        Я рядом. Расскажи, что у тебя на уме.
      </div>

      <div class="orb-area" id="orbArea">
        <div class="orb-halo"></div>
        <canvas id="orbCanvas"></canvas>
      </div>

      <div class="orb-hint">Коснись шара</div>

      <div class="quick-actions">
        <button class="quick-action" data-prompt="Расскажи что-нибудь интересное">Расскажи интересное</button>
        <button class="quick-action" data-prompt="Помоги мне с идеей">Помоги с идеей</button>
        <button class="quick-action" data-prompt="Давай просто поговорим">Поговорим</button>
      </div>

      <button class="quick-action" id="startChatButton" style="margin-top:20px">
        Начать разговор →
      </button>

    </section>

    <section class="screen chat-screen" id="chatScreen">
      <div class="messages" id="messages"></div>

      <div class="chat-composer">
        <div class="composer-inner">

          <div class="composer-tools">
            <button class="tool-button" id="voiceButton" title="Голосовой ввод">⌁</button>
          </div>

          <textarea
            id="messageInput"
            rows="1"
            placeholder="Напиши Энни..."
          ></textarea>

          <button class="send-button" id="sendButton">↑</button>
        </div>
      </div>
    </section>

    <section class="screen settings-screen" id="settingsScreen">
      <div class="settings-content">

        <h1 class="settings-heading">Настройки</h1>

        <div class="settings-section">
          <div class="section-title">ТВОЙ АККАУНТ</div>

          <button class="account-card" id="accountCard">
            <div class="account-avatar" id="accountAvatar">T</div>

            <div class="account-info">
              <div class="account-name" id="accountName">TEHNOCELL ID</div>
              <div class="account-id" id="accountId">Проверка аккаунта...</div>
              <div class="account-status" id="accountStatus">● Подключение</div>
            </div>

            <div class="account-arrow">›</div>
          </button>
        </div>

        <div class="settings-section">
          <div class="section-title">ВНЕШНИЙ ВИД</div>

          <button class="setting-row" id="themeSetting">
            <div>
              <div class="setting-row-title">Тема оформления</div>
              <div class="setting-row-desc">Светлая или тёмная тема</div>
            </div>
            <div class="setting-control" id="themeLabel">Тёмная</div>
          </button>

          <button class="setting-row" id="animationSetting">
            <div>
              <div class="setting-row-title">Анимации</div>
              <div class="setting-row-desc">Плавные эффекты интерфейса</div>
            </div>
            <div class="toggle on" id="animationToggle"></div>
          </button>
        </div>

        <div class="settings-section">
          <div class="section-title">ГОЛОС И ОБЩЕНИЕ</div>

          <button class="setting-row" id="speechSetting">
            <div>
              <div class="setting-row-title">Озвучивание ответов</div>
              <div class="setting-row-desc">Энни сможет говорить вслух</div>
            </div>
            <div class="toggle" id="speechToggle"></div>
          </button>
        </div>

        <div class="settings-section">
          <div class="section-title">ДАННЫЕ</div>

          <button class="setting-row" id="clearHistoryButton">
            <div>
              <div class="setting-row-title">Очистить историю</div>
              <div class="setting-row-desc">Удалить сохранённые диалоги</div>
            </div>
            <div class="setting-control">›</div>
          </button>
        </div>

      </div>
    </section>

  </main>
</div>

<div class="toast-container" id="toastContainer"></div>
<script>
/* ==========================================
   ENNIE — CONFIGURATION
========================================== */

const SUPABASE_URL = "ВСТАВЬТЕ_SUPABASE_URL";
const SUPABASE_ANON_KEY = "ВСТАВЬТЕ_SUPABASE_ANON_KEY";

const AI_FUNCTION_URL =
  "ВСТАВЬТЕ_URL_ВАШЕЙ_EDGE_FUNCTION";

let supabaseClient = null;

if (
  window.supabase &&
  SUPABASE_URL.startsWith("https://") &&
  !SUPABASE_URL.includes("ВСТАВЬТЕ") &&
  !SUPABASE_ANON_KEY.includes("ВСТАВЬТЕ")
) {
  supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );
}

/* ==========================================
   APPLICATION STATE
========================================== */

const state = {
  screen:"home",
  currentChat:null,
  chats:JSON.parse(localStorage.getItem("ennie_chats") || "[]"),
  dark:localStorage.getItem("ennie_theme") !== "light",
  animations:localStorage.getItem("ennie_animations") !== "false",
  speech:localStorage.getItem("ennie_speech") === "true",
  busy:false
};

const $ = id => document.getElementById(id);

/* ==========================================
   NOTIFICATIONS
========================================== */

function notify(message) {
  const item = document.createElement("div");
  item.className = "toast";
  item.textContent = message;

  $("toastContainer").appendChild(item);

  requestAnimationFrame(() => item.classList.add("show"));

  setTimeout(() => {
    item.classList.remove("show");
    setTimeout(() => item.remove(),400);
  },2800);
}

/* ==========================================
   SCREEN NAVIGATION
========================================== */

function showScreen(name) {
  state.screen = name;

  document.querySelectorAll(".screen").forEach(screen => {
    screen.classList.remove("active");
  });

  const target = $(name + "Screen");

  if (target) target.classList.add("active");

  $("topTitle").textContent =
    name === "home" ? "Главная" :
    name === "chat" ? "Диалог" :
    "Настройки";

  closeMenu();
}

function openMenu() {
  $("sidebar").classList.add("open");
  $("mobileOverlay").classList.add("show");
}

function closeMenu() {
  $("sidebar").classList.remove("open");
  $("mobileOverlay").classList.remove("show");
}

$("menuButton").addEventListener("click",openMenu);
$("mobileOverlay").addEventListener("click",closeMenu);

$("settingsButton").addEventListener("click",() => {
  showScreen("settings");
});

document.querySelectorAll("[data-screen]").forEach(button => {
  button.addEventListener("click",() => {
    showScreen(button.dataset.screen);
  });
});

/* ==========================================
   THEME
========================================== */

function updateTheme() {
  document.body.classList.toggle("light",!state.dark);

  $("themeButton").textContent = state.dark ? "◐" : "☀";
  $("themeLabel").textContent = state.dark ? "Тёмная" : "Светлая";

  localStorage.setItem(
    "ennie_theme",
    state.dark ? "dark" : "light"
  );
}

function toggleTheme() {
  state.dark = !state.dark;
  updateTheme();
}

$("themeButton").addEventListener("click",toggleTheme);
$("themeSetting").addEventListener("click",toggleTheme);

updateTheme();

/* ==========================================
   ORB — SPHERE TO HEART
========================================== */

const canvas = $("orbCanvas");
const ctx = canvas.getContext("2d");

let orbTime = 0;
let morph = 0;
let morphTarget = 0;
let orbSpeaking = false;

function resizeOrb() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1,2);

  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;

  ctx.setTransform(dpr,0,0,dpr,0,0);
}

window.addEventListener("resize",resizeOrb);
resizeOrb();

function heartPoint(angle) {
  const x = 16 * Math.pow(Math.sin(angle),3);

  const y =
    13 * Math.cos(angle) -
    5 * Math.cos(2*angle) -
    2 * Math.cos(3*angle) -
    Math.cos(4*angle);

  return {
    x:x / 17,
    y:-y / 17
  };
}

function drawOrb() {
  if (!canvas.width) return;

  const w = canvas.clientWidth;
  const h = canvas.clientHeight;

  ctx.clearRect(0,0,w,h);

  orbTime += .016;

  const easing = state.animations ? .055 : 1;

  morph += (morphTarget - morph) * easing;

  const breathing = state.animations
    ? 1 + Math.sin(orbTime * 1.15) * .012
    : 1;

  const pulse = orbSpeaking
    ? 1 + Math.sin(orbTime * 5) * .018
    : 1;

  const radius = Math.min(w,h) * .36 * breathing * pulse;

  const cx = w/2;
  const cy = h/2;

  const gradient = ctx.createRadialGradient(
    cx-radius*.35,
    cy-radius*.42,
    radius*.03,
    cx,
    cy,
    radius*1.15
  );

  gradient.addColorStop(0,"#ffffff");
  gradient.addColorStop(.35,"#f7f7f7");
  gradient.addColorStop(.72,"#d8d8d8");
  gradient.addColorStop(1,"#777777");

  ctx.save();

  ctx.translate(cx,cy);

  ctx.shadowColor = "#ffffff";
  ctx.shadowBlur = 25 + morph*20;

  ctx.beginPath();

  const steps = 180;

  for(let i=0;i<=steps;i++) {
    const angle = Math.PI*2*i/steps;

    const circleX = Math.cos(angle);
    const circleY = Math.sin(angle);

    const heart = heartPoint(angle);

    const x = circleX*(1-morph)+heart.x*morph;
    const y = circleY*(1-morph)+heart.y*morph;

    const px = x*radius;
    const py = y*radius;

    if(i===0) ctx.moveTo(px,py);
    else ctx.lineTo(px,py);
  }

  ctx.closePath();

  ctx.fillStyle = gradient;
  ctx.fill();

  ctx.shadowBlur = 0;

  const shine = ctx.createRadialGradient(
    -radius*.35,
    -radius*.4,
    1,
    -radius*.2,
    -radius*.2,
    radius*.85
  );

  shine.addColorStop(0,"#ffffff55");
  shine.addColorStop(1,"#ffffff00");

  ctx.fillStyle = shine;
  ctx.fill();

  ctx.restore();

  requestAnimationFrame(drawOrb);
}

drawOrb();

function transformHeart() {
  morphTarget = 1;

  setTimeout(() => {
    morphTarget = 0;
  },2600);
}

$("orbArea").addEventListener("click",transformHeart);

/* ==========================================
   CHAT STORAGE
========================================== */

function saveChats() {
  localStorage.setItem(
    "ennie_chats",
    JSON.stringify(state.chats)
  );
}

function createChat() {
  const chat = {
    id:crypto.randomUUID
      ? crypto.randomUUID()
      : String(Date.now()),
    title:"Новый диалог",
    messages:[],
    created:Date.now()
  };

  state.chats.unshift(chat);
  state.currentChat = chat.id;

  saveChats();
  renderChatList();
  renderMessages();

  showScreen("chat");
}

function getCurrentChat() {
  return state.chats.find(
    chat => chat.id === state.currentChat
  );
}

function renderChatList() {
  const list = $("chatList");
  list.innerHTML = "";

  state.chats.forEach(chat => {
    const button = document.createElement("button");

    button.className =
      "chat-item" +
      (chat.id === state.currentChat ? " active" : "");

    button.textContent = chat.title;

    button.addEventListener("click",() => {
      state.currentChat = chat.id;
      renderChatList();
      renderMessages();
      showScreen("chat");
    });

    list.appendChild(button);
  });
}

function renderMessages() {
  const chat = getCurrentChat();
  const box = $("messages");

  box.innerHTML = "";

  if (!chat) return;

  chat.messages.forEach(message => {
    const element = document.createElement("div");

    element.className =
      "message " +
      (message.role === "user" ? "user" : "assistant");

    element.textContent = message.content;

    box.appendChild(element);
  });

  box.scrollTop = box.scrollHeight;
}

function addMessage(role,content) {
  const chat = getCurrentChat();

  if (!chat) return;

  chat.messages.push({
    role,
    content,
    time:Date.now()
  });

  if (
    chat.title === "Новый диалог" &&
    role === "user"
  ) {
    chat.title = content.slice(0,35);
  }

  saveChats();
  renderChatList();
  renderMessages();
}

/* ==========================================
   NEW CHAT
========================================== */

$("newChatButton").addEventListener("click",createChat);
$("startChatButton").addEventListener("click",createChat);

document.querySelectorAll("[data-prompt]").forEach(button => {
  button.addEventListener("click",() => {
    createChat();
    $("messageInput").value = button.dataset.prompt;
    sendMessage();
  });
});

/* ==========================================
   MESSAGE INPUT
========================================== */

$("messageInput").addEventListener("input",event => {
  event.target.style.height = "auto";
  event.target.style.height =
    Math.min(event.target.scrollHeight,130)+"px";
});

$("messageInput").addEventListener("keydown",event => {
  if(event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

$("sendButton").addEventListener("click",sendMessage);
    /* ==========================================
   AI CONNECTION
========================================== */

async function requestEnnie(message,history) {
  if (
    AI_FUNCTION_URL.includes("ВСТАВЬТЕ") ||
    !AI_FUNCTION_URL.startsWith("https://")
  ) {
    throw new Error("Не настроено подключение ENNIE AI.");
  }

  const headers = {
    "Content-Type":"application/json"
  };

  if (supabaseClient) {
    const {data} = await supabaseClient.auth.getSession();

    if (data.session) {
      headers.Authorization =
        "Bearer "+data.session.access_token;
    }
  }

  const response = await fetch(AI_FUNCTION_URL,{
    method:"POST",
    headers,
    body:JSON.stringify({
      message,
      history
    })
  });

  if (!response.ok) {
    throw new Error("Ошибка сервера: "+response.status);
  }

  const data = await response.json();

  const answer =
    data.reply ||
    data.answer ||
    data.response ||
    data.message;

  if (!answer) {
    throw new Error("Сервер вернул пустой ответ.");
  }

  return answer;
}

/* ==========================================
   SEND MESSAGE
========================================== */

async function sendMessage() {
  if(state.busy) return;

  const input = $("messageInput");
  const message = input.value.trim();

  if(!message) return;

  if(!state.currentChat) {
    createChat();
  }

  input.value = "";
  input.style.height = "auto";

  addMessage("user",message);

  showScreen("chat");

  state.busy = true;
  $("sendButton").disabled = true;

  const typing = document.createElement("div");
  typing.className = "message assistant typing";
  typing.textContent = "···";

  $("messages").appendChild(typing);
  $("messages").scrollTop = $("messages").scrollHeight;

  try {
    const chat = getCurrentChat();

    const history = chat.messages
      .slice(-15)
      .map(item => ({
        role:item.role,
        content:item.content
      }));

    const answer = await requestEnnie(
      message,
      history
    );

    typing.remove();

    addMessage("assistant",answer);

    if(state.speech) {
      speak(answer);
    }

  } catch(error) {
    typing.remove();

    addMessage(
      "assistant",
      "Не получилось получить ответ. Проверь подключение к ENNIE AI."
    );

    console.error("ENNIE AI:",error);
  }

  state.busy = false;
  $("sendButton").disabled = false;
}

/* ==========================================
   SUPABASE ACCOUNT
========================================== */

async function loadAccount() {
  if(!supabaseClient) {
    $("accountName").textContent = "TEHNOCELL ID";
    $("accountId").textContent = "Аккаунт не подключён";
    $("accountStatus").textContent = "○ Не авторизован";
    return;
  }

  try {
    const {data,error} =
      await supabaseClient.auth.getUser();

    if(error || !data.user) {
      $("accountName").textContent = "TEHNOCELL ID";
      $("accountId").textContent = "Войти в аккаунт";
      $("accountStatus").textContent = "○ Не авторизован";
      return;
    }

    const user = data.user;
    const metadata = user.user_metadata || {};

    $("accountName").textContent =
      metadata.display_name ||
      metadata.full_name ||
      metadata.name ||
      "Пользователь TEHNOCELL";

    $("accountId").textContent =
      "TC-" + user.id.slice(0,8).toUpperCase();

    $("accountStatus").textContent = "● Аккаунт подключён";

    if(metadata.avatar_url) {
      $("accountAvatar").innerHTML = "";

      const img = document.createElement("img");
      img.src = metadata.avatar_url;
      img.alt = "Аватар";

      $("accountAvatar").appendChild(img);
    }

  } catch(error) {
    console.error(error);
    $("accountStatus").textContent = "○ Ошибка подключения";
  }
}

$("accountCard").addEventListener("click",() => {
  if(!supabaseClient) {
    notify("Сначала настрой подключение TEHNOCELL ID.");
    return;
  }

  window.location.href = "account.html";
});

loadAccount();

if(supabaseClient) {
  supabaseClient.auth.onAuthStateChange(() => {
    loadAccount();
  });
}

/* ==========================================
   VOICE INPUT
========================================== */

let recognition = null;

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

if(SpeechRecognition) {
  recognition = new SpeechRecognition();

  recognition.lang = "ru-RU";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onresult = event => {
    const result = event.results[0][0].transcript;

    $("messageInput").value +=
      ($("messageInput").value ? " " : "") + result;
  };

  recognition.onerror = () => {
    notify("Не удалось распознать речь.");
  };

  recognition.onend = () => {
    $("voiceButton").style.color = "";
  };
}

$("voiceButton").addEventListener("click",() => {
  if(!recognition) {
    notify("Голосовой ввод не поддерживается браузером.");
    return;
  }

  try {
    recognition.start();
    $("voiceButton").style.color = "#8bd9a5";
  } catch(error) {
    recognition.stop();
  }
});

/* ==========================================
   VOICE OUTPUT
========================================== */

function speak(text) {
  if(!("speechSynthesis" in window)) {
    notify("Озвучивание не поддерживается.");
    return;
  }

  window.speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang = "ru-RU";
  utterance.rate = .96;
  utterance.pitch = 1.08;
  utterance.volume = 1;

  const voices = speechSynthesis.getVoices();

  const russianVoice = voices.find(voice =>
    voice.lang.toLowerCase().startsWith("ru")
  );

  if(russianVoice) {
    utterance.voice = russianVoice;
  }

  orbSpeaking = true;

  utterance.onend = () => {
    orbSpeaking = false;
  };

  utterance.onerror = () => {
    orbSpeaking = false;
  };

  speechSynthesis.speak(utterance);
}

/* ==========================================
   SETTINGS
========================================== */

function updateSettings() {
  $("animationToggle").classList.toggle(
    "on",
   state.animations
  );

  $("speechToggle").classList.toggle(
    "on",
   state.speech
  );
}

$("animationSetting").addEventListener("click",() => {
  state.animations = !state.animations;

  localStorage.setItem(
    "ennie_animations",
   String(state.animations)
  );

  updateSettings();
});

$("speechSetting").addEventListener("click",() => {
  state.speech = !state.speech;

  localStorage.setItem(
    "ennie_speech",
   String(state.speech)
  );

  updateSettings();
});

$("clearHistoryButton").addEventListener("click",() => {
  const confirmed = confirm(
    "Удалить всю историю диалогов? Это действие нельзя отменить."
  );

  if(!confirmed) return;

  state.chats = [];
  state.currentChat = null;

  saveChats();
  renderChatList();
  renderMessages();

  notify("История диалогов очищена.");
  showScreen("home");
});

updateSettings();

/* ==========================================
   GREETING
========================================== */

function updateGreeting() {
  const hour = new Date().getHours();

  let greeting = "Привет. Я Энни.";

  if(hour >= 5 && hour < 12) {
    greeting = "Доброе утро.";
  } else if(hour >= 12 && hour < 18) {
    greeting = "Добрый день.";
  } else if(hour >= 18 && hour < 23) {
    greeting = "Добрый вечер.";
  } else {
    greeting = "Не спится?";
  }

  $("greeting").textContent = greeting;
}

updateGreeting();

/* ==========================================
   INITIALIZATION
========================================== */

renderChatList();

if(state.chats.length) {
  state.currentChat = state.chats[0].id;
}

console.log("ENNIE — TEHNOCELL AI initialized.");
</script>
