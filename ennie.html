<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080808">

<title>ENNIE — TEHNOCELL AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root {
    --bg:#080808;
    --panel:#101010;
    --panel2:#171717;
    --text:#f5f5f5;
    --muted:#777;
    --border:rgba(255,255,255,.09);
    --accent:#fff;
}

* {
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body {
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
    height:100dvh;
    overflow:hidden;
}

button,input {
    font:inherit;
}

button {
    color:inherit;
    cursor:pointer;
}

.app {
    display:flex;
    height:100dvh;
    width:100%;
}

/* SIDEBAR */

.sidebar {
    width:275px;
    background:#0d0d0d;
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding:20px 15px;
    flex-shrink:0;
    z-index:20;
}

.brand {
    display:flex;
    align-items:center;
    gap:11px;
    padding:8px 7px 25px;
}

.brand-logo {
    width:34px;
    height:34px;
    border:1px solid rgba(255,255,255,.7);
    border-radius:50%;
    position:relative;
    box-shadow:0 0 15px rgba(255,255,255,.12);
}

.brand-logo:after {
    content:"";
    position:absolute;
    inset:7px;
    border-radius:50%;
    background:white;
    box-shadow:0 0 12px white;
}

.brand-name {
    font-size:19px;
    font-weight:700;
    letter-spacing:3px;
}

.brand-sub {
    font-size:9px;
    color:#777;
    letter-spacing:2px;
    margin-top:4px;
}

.new-chat {
    height:47px;
    border:1px solid var(--border);
    background:#171717;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    transition:.2s;
}

.new-chat:hover {
    background:#222;
}

.side-label {
    color:#666;
    font-size:11px;
    letter-spacing:1.5px;
    margin:28px 8px 12px;
}

.history {
    flex:1;
    overflow-y:auto;
}

.history-item {
    display:flex;
    align-items:center;
    gap:8px;
    padding:12px 10px;
    border-radius:10px;
    color:#aaa;
    font-size:13px;
    cursor:pointer;
    margin-bottom:3px;
}

.history-item:hover,
.history-item.active {
    background:#1b1b1b;
    color:white;
}

.history-title {
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    flex:1;
}

.delete-chat {
    opacity:.65;
    border:0;
    background:transparent;
    color:#888;
    font-size:17px;
}

/* PROFILE */

.profile {
    border-top:1px solid var(--border);
    padding:17px 5px 3px;
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar {
    width:37px;
    height:37px;
    border-radius:50%;
    background:#222;
    display:grid;
    place-items:center;
    font-size:14px;
}

.profile-info {
    flex:1;
    min-width:0;
}

.profile-name {
    font-size:13px;
    font-weight:600;
}

.profile-status {
    font-size:10px;
    color:#777;
    margin-top:4px;
}

.icon-button {
    border:0;
    background:transparent;
    color:#888;
    padding:8px;
}

/* MAIN */

.main {
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    position:relative;
}

.topbar {
    height:65px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    flex-shrink:0;
}

.top-title {
    font-size:14px;
    font-weight:600;
    letter-spacing:1px;
}

.top-actions {
    display:flex;
    gap:8px;
}

.top-button {
    border:1px solid var(--border);
    background:transparent;
    border-radius:10px;
    width:37px;
    height:37px;
    display:grid;
    place-items:center;
    color:#aaa;
    font-size:17px;
}

/* =================================
   ENNIE — LIVING CORE
================================= */

.welcome {
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    overflow:hidden;
    position:relative;
}

.core-wrap {
    width: 280px;
    height: 280px;
    position: relative;
    display: grid;
    place-items: center;
    margin: 0 auto 22px;
    overflow: visible;
    background: transparent;
    border: none;
    box-shadow: none;
    isolation: isolate;
}

#ennieCoreCanvas {
    position: absolute;
    width: 160%;
    height: 160%;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    display: block;
    overflow: visible;
    background: transparent;
    border: none;
    outline: none;
    pointer-events: none;
}

.core-wrap::before {
    content: "";
    position: absolute;
    inset: -35%;
    border-radius: 50%;
    background: radial-gradient(
        circle,
        rgba(255,255,255,.13),
        rgba(255,255,255,.045) 42%,
        transparent 72%
    );
    filter: blur(35px);
    pointer-events: none;
    z-index: -1;
}

@media(max-width:700px) {
    .core-wrap {
        width: 280px;
        height: 280px;
    }
}

.core-wrap::before {
    content:"";
    position:absolute;
    inset:12%;
    border-radius:50%;
    background:radial-gradient(
        circle,
        rgba(255,255,255,.18),
        rgba(255,255,255,.06) 42%,
        transparent 72%
    );
    filter:blur(22px);
    animation:coreAura 5s ease-in-out infinite;
    z-index:-1;
}

@keyframes coreAura {
    0%,100% {
        transform:scale(.85);
        opacity:.45;
    }
    50% {
        transform:scale(1.2);
        opacity:1;
    }
}

.welcome-title {
    font-size:27px;
    font-weight:600;
    letter-spacing:7px;
    margin-top:3px;
    color:#fff;
    text-shadow:0 0 25px rgba(255,255,255,.18);
}

.welcome-sub {
    margin-top:13px;
    color:#888;
    font-size:13px;
    line-height:1.9;
    letter-spacing:.2px;
}

.welcome-greeting {
    margin-top:17px;
    color:#eee;
    font-size:14px;
    font-weight:500;
    min-height:22px;
    animation:greetingAppear .8s ease both;
}

@keyframes greetingAppear {
    from {
        opacity:0;
        transform:translateY(8px);
    }
    to {
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:700px) {
    .core-wrap {
        width:170px;
        height:170px;
        margin-bottom:20px;
    }

    .welcome-title {
        font-size:24px;
    }

    .welcome-sub {
        font-size:12px;
    }

    .welcome-greeting {
        font-size:13px;
    }
}

/* MESSAGES */

.messages {
    flex:1;
    overflow-y:auto;
    padding:25px max(20px, calc((100% - 760px)/2));
    display:none;
    flex-direction:column;
    gap:22px;
    scroll-behavior:smooth;
}

.message {
    display:flex;
    gap:12px;
    align-items:flex-start;
    max-width:100%;
}

.message.user {
    flex-direction:row-reverse;
}

.message-avatar {
    width:30px;
    height:30px;
    min-width:30px;
    border-radius:50%;
    background:#202020;
    display:grid;
    place-items:center;
    font-size:10px;
    border:1px solid var(--border);
}

.message-content {
    max-width:min(80%,650px);
    font-size:14px;
    line-height:1.75;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.message.user .message-content {
    background:#1c1c1c;
    border:1px solid var(--border);
    padding:12px 15px;
    border-radius:15px 4px 15px 15px;
}

.message.assistant .message-content {
    padding:5px 0;
}

.message-time {
    font-size:10px;
    color:#666;
    margin-top:7px;
}

/* THINKING */

.typing {
    display:flex;
    gap:5px;
    padding:12px 0;
}

.typing span {
    width:5px;
    height:5px;
    background:#ddd;
    border-radius:50%;
    animation:typing 1s infinite alternate;
}

.typing span:nth-child(2) {animation-delay:.2s}
.typing span:nth-child(3) {animation-delay:.4s}

@keyframes typing {
    to {opacity:.2;transform:translateY(-4px)}
}

/* COMPOSER */

.composer-area {
    position:relative;
    padding:15px 20px 22px;
    width:100%;
    max-width:820px;
    margin:0 auto;
}

.composer {
    min-height:57px;
    border:1px solid rgba(255,255,255,.15);
    background:#131313;
    border-radius:18px;
    display:flex;
    align-items:flex-end;
    padding:9px 10px;
    gap:8px;
    transition:border .2s,box-shadow .2s;
}

.composer:focus-within {
    border-color:rgba(255,255,255,.4);
    box-shadow:0 0 25px rgba(255,255,255,.04);
}

#messageInput {
    flex:1;
    min-width:0;
    max-height:130px;
    resize:none;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    padding:9px 5px;
    font-size:14px;
    line-height:1.5;
}

#messageInput::placeholder {
    color:#686868;
}

.send-button {
    width:39px;
    height:39px;
    border:0;
    border-radius:12px;
    background:white;
    color:black;
    font-size:18px;
    display:grid;
    place-items:center;
    flex-shrink:0;
}

.send-button:disabled {
    opacity:.35;
    cursor:not-allowed;
}

.tool-button {
    width:39px;
    height:39px;
    border:0;
    border-radius:11px;
    background:transparent;
    color:#aaa;
    font-size:18px;
    display:grid;
    place-items:center;
    flex-shrink:0;
}

.tool-button:hover {
    background:#252525;
    color:white;
}

.disclaimer {
    text-align:center;
    color:#555;
    font-size:10px;
    margin-top:12px;
}

/* ATTACHMENTS */

.attachment-preview {
    position:absolute;
    left:14px;
    bottom:76px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px;
    max-width:calc(100% - 28px);
    border:1px solid var(--border);
    border-radius:13px;
    background:#171717;
    z-index:5;
}

.attachment-preview[hidden] {
    display:none;
}

.attachment-preview img {
    width:54px;
    height:54px;
    object-fit:cover;
    border-radius:8px;
}

.attachment-preview span {
    font-size:12px;
    color:#ddd;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.attachment-remove {
    width:28px;
    height:28px;
    border:0;
    border-radius:50%;
    background:#292929;
    color:#fff;
}

.message-image {
    display:block;
    max-width:min(260px,65vw);
    max-height:320px;
    object-fit:contain;
    border-radius:13px;
    margin-bottom:8px;
    border:1px solid var(--border);
}

.message-caption {
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

/* SCREEN VIGNETTE */

.screen-vignette {
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:50;
    opacity:0;
    transition:opacity 1s ease;
    box-shadow:
        inset 0 0 65px rgba(255,255,255,.12),
        inset 0 0 140px rgba(255,255,255,.07);
}

body.listening .screen-vignette,
body.speaking .screen-vignette {
    opacity:1;
}
    /* SETTINGS */

.modal-backdrop {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(8px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    z-index:100;
}

.modal-backdrop.open {
    display:flex;
}

.modal {
    width:100%;
    max-width:420px;
    max-height:85dvh;
    overflow-y:auto;
    background:#151515;
    border:1px solid var(--border);
    border-radius:20px;
    padding:22px;
}

.modal-header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
}

.modal-header h2 {
    font-size:18px;
}

.modal-close {
    border:0;
    background:transparent;
    color:#aaa;
    font-size:24px;
}

.setting-row {
    padding:15px 0;
    border-bottom:1px solid var(--border);
}

.setting-title {
    font-size:13px;
    margin-bottom:6px;
}

.setting-description {
    font-size:11px;
    color:#777;
    line-height:1.5;
}

.modal-action {
    width:100%;
    padding:12px;
    margin-top:12px;
    border:1px solid var(--border);
    background:#222;
    border-radius:11px;
    color:white;
}

/* MOBILE */

.menu-toggle {
    display:none;
}

@media(max-width:700px) {
    .sidebar {
        position:fixed;
        left:-290px;
        top:0;
        bottom:0;
        width:275px;
        transition:left .25s ease;
        box-shadow:10px 0 40px rgba(0,0,0,.4);
    }

    body.menu-open .sidebar {
        left:0;
    }

    .menu-toggle {
        display:grid;
    }

    .topbar {
        padding:0 13px;
        height:58px;
    }

    .messages {
        padding:20px 14px;
    }

    .composer-area {
        padding:10px 10px 15px;
    }

    .core-wrap {
        transform:scale(.88);
        margin-bottom:18px;
    }

    .welcome-title {
        font-size:23px;
    }

    .message-content {
        font-size:13px;
    }
}

</style>
</head>

function clearAttachment() {

    const preview = document.getElementById("attachmentPreview");

    preview.innerHTML = "";

function showAttachmentPreview(file) {
    const preview = document.getElementById("attachmentPreview");

    const image = document.createElement("img");
    const label = document.createElement("span");
    const remove = document.createElement("button");

    image.src = URL.createObjectURL(file);
    image.onload = () => URL.revokeObjectURL(image.src);

    label.textContent = file.name;

    remove.type = "button";
    remove.className = "attachment-remove";
    remove.textContent = "×";
    remove.addEventListener("click", clearAttachment);

    preview.replaceChildren(image, label, remove);
    preview.hidden = false;
}

async function uploadChatImage(file) {
    if (!currentUser) {
        throw new Error("Сначала войди через TEHNOCELL ID.");
    }

    if (!file || !file.type.startsWith("image/")) {
        throw new Error("Выбери изображение.");
    }

    if (file.size > 8 * 1024 * 1024) {
        throw new Error("Размер фотографии не должен превышать 8 МБ.");
    }

    const extension = (
        file.name.split(".").pop() || "jpg"
    ).replace(/[^a-z0-9]/gi, "").toLowerCase();

    const path =
        `${currentUser.id}/${Date.now()}-${crypto.randomUUID()}.${extension}`;

    const { error } = await supabaseClient.storage
        .from(IMAGE_BUCKET)
        .upload(path, file, {
            contentType: file.type,
            upsert: false
        });

    if (error) {
        if (error.message && /bucket not found/i.test(error.message)) {
            throw new Error(
                'В Supabase Storage создай приватный bucket "ennie-attachments".'
            );
        }

        throw error;
    }

    return {
        path,
        name: file.name,
        type: file.type
    };
}

async function createImageUrl(path) {
    const { data, error } = await supabaseClient.storage
        .from(IMAGE_BUCKET)
        .createSignedUrl(path, 60 * 60);

    if (error) throw error;

    return data.signedUrl;
}

async function renderStoredContent(container, content) {
    const raw = String(content || "");

    if (!raw.startsWith(IMAGE_MARKER)) {
        container.textContent = raw;
        return;
    }

    try {
        const parsed = JSON.parse(
            raw.slice(IMAGE_MARKER.length)
        );

        const imageUrl = await createImageUrl(parsed.path);

        const image = document.createElement("img");

        image.className = "message-image";
        image.src = imageUrl;
        image.alt = parsed.name || "Фотография";

        container.appendChild(image);

        if (parsed.caption) {
            const caption = document.createElement("div");

            caption.className = "message-caption";
            caption.textContent = parsed.caption;

            container.appendChild(caption);
        }

    } catch (error) {
        console.error("IMAGE LOAD ERROR:", error);

        container.textContent =
            "Не удалось загрузить фотографию.";
    }
}

    const { error: messagesError } = await supabaseClient
        .from("ennie_messages")
        .delete()

        .eq("user_id", currentUser.id);

    if (messagesError) {

        showError("Не удалось удалить сообщения: " + messagesError.message);

    }

    const { error: chatError } = await supabaseClient
        .from("ennie_chats")
        .delete()
        .eq("id", chatId)
        .eq("user_id", currentUser.id);

    if (chatError) {
        console.error("DELETE CHAT ERROR:", chatError);
        showError("Не удалось удалить диалог: " + chatError.message);
        return;

    if (currentChatId === chatId) {

/* =================================
   SEND MESSAGE
================================= */

async function sendMessage() {
    if (isSending) return;

    const text = messageInput.value.trim();
    const imageFile = selectedImage;

    if (!text && !imageFile) return;

    if (!currentUser) {
        showError("Сначала войди через TEHNOCELL ID.");
        return;
    }

    isSending = true;
    sendBtn.disabled = true;

    messageInput.value = "";
    messageInput.style.height = "auto";

    try {
        if (!currentChatId) {
            const chat = await createChat();

            if (!chat) {
                throw new Error("Не удалось создать диалог.");
            }
        }

        showMessages();

        let storedUserContent = text;

        if (imageFile) {
            const uploaded = await uploadChatImage(imageFile);

            storedUserContent = IMAGE_MARKER + JSON.stringify({
                ...uploaded,
                caption: text
            });
        }

        addMessage("user", storedUserContent);
        await saveMessage("user", storedUserContent);
        clearAttachment();

        const { count, error: countError } = await supabaseClient
            .from("ennie_messages")
            .select("*", { count: "exact", head: true })
            .eq("chat_id", currentChatId)
            .eq("user_id", currentUser.id);

        if (!countError && count === 1) {
            await updateChatTitle(text || "Фотография");
        }

        const { data: previousMessages, error: historyError } =
            await supabaseClient
                .from("ennie_messages")
                .select("role,content")
                .eq("chat_id", currentChatId)
                .eq("user_id", currentUser.id)
                .order("created_at", { ascending: true });

        if (historyError) throw historyError;

        showThinking();

        const { data, error } = await supabaseClient.functions.invoke(
            "ennie-core-v10",
            {
                body: {
                    messages: previousMessages || []
                }
            }
        );

        hideThinking();

        if (error) {
            console.error("ENNIE CORE ERROR:", error);
            throw new Error(error.message || "Ошибка ENNIE CORE V10.");
        }

        if (!data || data.success !== true || !data.answer) {
            throw new Error(
                data?.error || "ENNIE не вернула ответ."
            );
        }

        const answer = data.answer;

        addMessage("assistant", answer);
        await saveMessage("assistant", answer);

        await loadChats();

        if (voiceEnabled && typeof speakText === "function") {
            speakText(answer);
        }

    } catch (error) {
        hideThinking();

        console.error("SEND MESSAGE ERROR:", error);

        addMessage(
            "assistant",
            "Не удалось получить ответ: " + error.message
        );

    } finally {
        isSending = false;
        sendBtn.disabled = false;
        messageInput.focus();
    }
        }
    /* =================================
   FISH AUDIO VOICE OUTPUT
================================= */

let ennieAudio = null;

async function speakText(text) {
    if (!text) return;

    try {
        if (ennieAudio) {
            ennieAudio.pause();
            URL.revokeObjectURL(ennieAudio.src);
            ennieAudio = null;
        }

        document.body.classList.add("speaking");

        const { data: sessionData, error: sessionError } =
            await supabaseClient.auth.getSession();

        if (sessionError) throw sessionError;

        const session = sessionData.session;

        if (!session) {
            throw new Error("Необходим вход в TEHNOCELL ID.");
        }

        const response = await fetch(
            `${SUPABASE_URL}/functions/v1/ennie-voice`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "apikey": SUPABASE_KEY,
                    "Authorization": `Bearer ${session.access_token}`
                },
                body: JSON.stringify({ text })
            }
        );

        if (!response.ok) {
            throw new Error(await response.text());
        }

        const audioBlob = await response.blob();
        const audioUrl = URL.createObjectURL(audioBlob);

        ennieAudio = new Audio(audioUrl);

        ennieAudio.onended = () => {
            document.body.classList.remove("speaking");
            URL.revokeObjectURL(audioUrl);
        };

        ennieAudio.onerror = () => {
            document.body.classList.remove("speaking");
            URL.revokeObjectURL(audioUrl);
            console.error("ENNIE AUDIO PLAYBACK ERROR");
        };

        await ennieAudio.play();

    } catch (error) {
        document.body.classList.remove("speaking");
        console.error("ENNIE VOICE ERROR:", error);
    }
}

/* =================================
   VOICE INPUT
================================= */

function setupVoiceRecognition() {
    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    const micBtn = document.getElementById("micBtn");

    if (!SpeechRecognition) {
        micBtn.addEventListener("click", () => {
            showError("Голосовой ввод не поддерживается этим браузером.");
        });
        return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = "ru-RU";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = () => {
        isListening = true;
        document.body.classList.add("listening");
        micBtn.style.color = "white";
    };

    recognition.onresult = event => {
        const result = event.results[0][0].transcript;
        messageInput.value = result;
        messageInput.focus();
        messageInput.dispatchEvent(new Event("input"));
    };

    recognition.onerror = event => {
        console.error("VOICE ERROR:", event.error);
    };

    recognition.onend = () => {
        isListening = false;
        document.body.classList.remove("listening");
        micBtn.style.color = "";
    };

    micBtn.addEventListener("click", () => {
        if (isListening) {
            recognition.stop();
        } else {
            try {
                recognition.start();
            } catch (error) {
                console.error(error);
            }
        }
    });
}

/* =========================================
   ENNIE — LUMINOUS LIVING CORE
========================================= */

(() => {
    const canvas = document.getElementById("ennieCoreCanvas");
    if (!canvas) return;

    const ctx = canvas.getContext("2d");
    const wrap = canvas.parentElement;

    let w = 0;
    let h = 0;
    let time = 0;
    let particles = [];
    let animationId;

    const TAU = Math.PI * 2;

    function resize() {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        w = rect.width;
        h = rect.height;

        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        particles = Array.from({ length: 130 }, () => ({
    angle: Math.random() * TAU,
    radius: 125 + Math.random() * 85,
    speed: .001 + Math.random() * .004,
    size: .8 + Math.random() * 2.2,
    alpha: .4 + Math.random() * .6,
    phase: Math.random() * TAU
}));
    }

    function heartPoint(t) {
        return {
            x: 16 * Math.pow(Math.sin(t), 3),
            y: -(
                13 * Math.cos(t) -
                5 * Math.cos(2 * t) -
                2 * Math.cos(3 * t) -
                Math.cos(4 * t)
            )
        };
    }

    function drawOrb(cx, cy, radius, morph, breathe) {
        const r = radius * breathe;

        ctx.save();
        ctx.translate(cx, cy);

        // Мягкая внешняя аура
        const aura = ctx.createRadialGradient(
            0, 0, r * .3,
            0, 0, r * 1.7
        );

        aura.addColorStop(0, "rgba(255,255,255,.2)");
        aura.addColorStop(.55, "rgba(255,255,255,.07)");
        aura.addColorStop(1, "rgba(255,255,255,0)");

        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(0, 0, r * 1.7, 0, TAU);
        ctx.fill();

        // Форма шара / сердца
        ctx.beginPath();

        const points = 180;

        for (let i = 0; i <= points; i++) {
            const a = i / points * TAU;

            const circleX = Math.cos(a) * 19;
            const circleY = Math.sin(a) * 19;

            const heart = heartPoint(a);

            const x = (
                circleX * (1 - morph) +
                heart.x * morph
            ) * (r / 19);

            const y = (
                circleY * (1 - morph) +
                heart.y * morph
            ) * (r / 19);

            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        }

        ctx.closePath();

        // Объёмная белая поверхность
        const surface = ctx.createRadialGradient(
            -r * .3,
            -r * .38,
            r * .03,
            0,
            0,
            r * 1.15
        );

        surface.addColorStop(0, "#ffffff");
        surface.addColorStop(.48, "#f7f7f7");
        surface.addColorStop(.78, "#dedede");
        surface.addColorStop(1, "#a9a9a9");

        ctx.shadowColor = "rgba(255,255,255,.65)";
        ctx.shadowBlur = 28;

        ctx.fillStyle = surface;
        ctx.fill();

        // Мягкий блик
        ctx.shadowBlur = 0;

        const highlight = ctx.createRadialGradient(
            -r * .28,
            -r * .4,
            0,
            -r * .2,
            -r * .3,
            r * .9
        );

        highlight.addColorStop(0, "rgba(255,255,255,.42)");
        highlight.addColorStop(1, "rgba(255,255,255,0)");

        ctx.fillStyle = highlight;
        ctx.fill();

        ctx.restore();
    }

    function drawOrbits(cx, cy, radius) {
        ctx.save();
        ctx.translate(cx, cy);

        for (let i = 0; i < 7; i++) {
            const rotation =
                time * (.13 + i * .018) + i * .47;

            ctx.save();
            ctx.rotate(rotation);

            ctx.beginPath();

            ctx.ellipse(
                0,
                0,
                radius * (1.13 + i * .035),
                radius * (.91 + i * .025),
                i * .12,
                0,
                TAU
            );

            ctx.strokeStyle =
                `rgba(255,255,255,${.09 + (i % 3) * .035})`;

            ctx.lineWidth = 1.5;
            ctx.shadowColor = "#ffffff";
            ctx.shadowBlur = 9;
            ctx.stroke();

            ctx.restore();
        }

        ctx.restore();
    }

    function drawParticles(cx, cy) {
    particles.forEach(p => {
        p.angle += p.speed;

        const x = cx + Math.cos(p.angle) * p.radius;
        const y = cy + Math.sin(p.angle) * p.radius;

        const flicker =
            .55 + Math.sin(time * 2.5 + p.phase) * .4;

        const alpha = Math.max(.15, p.alpha * flicker);

        // Мягкое свечение частицы
        ctx.beginPath();
        ctx.arc(x, y, p.size * 3, 0, TAU);
        ctx.fillStyle = `rgba(255,255,255,${alpha * .12})`;
        ctx.fill();

        // Яркое ядро частицы
        ctx.beginPath();
        ctx.arc(x, y, p.size, 0, TAU);
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.shadowColor = "#ffffff";
        ctx.shadowBlur = 12;
        ctx.fill();
    });

    ctx.shadowBlur = 0;
    }

        ctx.shadowBlur = 0;
    }

    function draw() {
        animationId = requestAnimationFrame(draw);

        ctx.clearRect(0, 0, w, h);

        time += .012;

        const cx = w / 2;
        const cy = h / 2;

        const morph =
            Math.pow((Math.sin(time * .42) + 1) / 2, 3);

        const breathe =
            1 + Math.sin(time * 1.4) * .018;

        const radius = Math.min(w, h) * .355;

        // Частицы позади шара
        drawParticles(cx, cy);

        // Световые орбиты
        drawOrbits(cx, cy, radius);

        // Главное ядро
        drawOrb(cx, cy, radius, morph, breathe);
    }

    resize();

    window.addEventListener("resize", resize);

    draw();
})();

</script>
