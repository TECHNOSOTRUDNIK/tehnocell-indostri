<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080808">

<title>ENNIE — TEHNOCELL AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root {
    --bg:#080808;
    --panel:#101010;
    --panel2:#171717;
    --text:#f5f5f5;
    --muted:#777;
    --border:rgba(255,255,255,.09);
    --accent:#fff;
}

* {
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body {
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
    height:100dvh;
    overflow:hidden;
}

button,input {
    font:inherit;
}

button {
    color:inherit;
    cursor:pointer;
}

.app {
    display:flex;
    height:100dvh;
    width:100%;
}

/* SIDEBAR */

.sidebar {
    width:275px;
    background:#0d0d0d;
    border-right:1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding:20px 15px;
    flex-shrink:0;
    z-index:20;
}

.brand {
    display:flex;
    align-items:center;
    gap:11px;
    padding:8px 7px 25px;
}

.brand-logo {
    width:34px;
    height:34px;
    border:1px solid rgba(255,255,255,.7);
    border-radius:50%;
    position:relative;
    box-shadow:0 0 15px rgba(255,255,255,.12);
}

.brand-logo:after {
    content:"";
    position:absolute;
    inset:7px;
    border-radius:50%;
    background:white;
    box-shadow:0 0 12px white;
}

.brand-name {
    font-size:19px;
    font-weight:700;
    letter-spacing:3px;
}

.brand-sub {
    font-size:9px;
    color:#777;
    letter-spacing:2px;
    margin-top:4px;
}

.new-chat {
    height:47px;
    border:1px solid var(--border);
    background:#171717;
    border-radius:13px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    transition:.2s;
}

.new-chat:hover {
    background:#222;
}

.side-label {
    color:#666;
    font-size:11px;
    letter-spacing:1.5px;
    margin:28px 8px 12px;
}

.history {
    flex:1;
    overflow-y:auto;
}

.history-item {
    display:flex;
    align-items:center;
    gap:8px;
    padding:12px 10px;
    border-radius:10px;
    color:#aaa;
    font-size:13px;
    cursor:pointer;
    margin-bottom:3px;
}

.history-item:hover,
.history-item.active {
    background:#1b1b1b;
    color:white;
}

.history-title {
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    flex:1;
}

.delete-chat {
    opacity:0;
    border:0;
    background:transparent;
    color:#888;
    font-size:17px;
}

/* PROFILE */

.profile {
    border-top:1px solid var(--border);
    padding:17px 5px 3px;
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar {
    width:37px;
    height:37px;
    border-radius:50%;
    background:#222;
    display:grid;
    place-items:center;
    font-size:14px;
}

.profile-info {
    flex:1;
    min-width:0;
}

.profile-name {
    font-size:13px;
    font-weight:600;
}

.profile-status {
    font-size:10px;
    color:#777;
    margin-top:4px;
}

.icon-button {
    border:0;
    background:transparent;
    color:#888;
    padding:8px;
}

/* MAIN */

.main {
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    position:relative;
}

.topbar {
    height:65px;
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
    flex-shrink:0;
}

.top-title {
    font-size:14px;
    font-weight:600;
    letter-spacing:1px;
}

.top-actions {
    display:flex;
    gap:8px;
}

.top-button {
    border:1px solid var(--border);
    background:transparent;
    border-radius:10px;
    width:37px;
    height:37px;
    display:grid;
    place-items:center;
    color:#aaa;
    font-size:17px;
}
    /* WELCOME */

.welcome {
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:25px;
    overflow-y:auto;
}

.core-wrap {
    width:210px;
    height:210px;
    position:relative;
    display:grid;
    place-items:center;
    margin-bottom:35px;
}

.core-glow {
    position:absolute;
    width:190px;
    height:190px;
    border-radius:50%;
    background:radial-gradient(
        circle,
        rgba(255,255,255,.2) 0%,
        rgba(255,255,255,.07) 35%,
        transparent 70%
    );
    filter:blur(15px);
    animation:glow 5s ease-in-out infinite;
}

.core {
    width:112px;
    height:112px;
    border-radius:50%;
    position:relative;
    background:
        radial-gradient(circle at 35% 30%,
        #fff 0%,
        #e8e8e8 12%,
        #a8a8a8 28%,
        #333 48%,
        #090909 72%);
    box-shadow:
        0 0 18px rgba(255,255,255,.65),
        0 0 45px rgba(255,255,255,.2),
        inset -12px -15px 25px #000,
        inset 8px 8px 20px rgba(255,255,255,.7);
    animation:coreBreath 5s ease-in-out infinite;
    z-index:2;
}

.core:before {
    content:"";
    position:absolute;
    inset:-10px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.55);
    box-shadow:0 0 18px rgba(255,255,255,.15);
    animation:rotateCore 12s linear infinite;
}

.core:after {
    content:"";
    position:absolute;
    inset:-22px;
    border-radius:50%;
    border:1px solid rgba(255,255,255,.17);
    border-top-color:rgba(255,255,255,.8);
    border-bottom-color:rgba(255,255,255,.4);
    animation:rotateCore 18s linear infinite reverse;
}

.core-ring {
    position:absolute;
    width:175px;
    height:175px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:50%;
    transform:rotateX(65deg);
    animation:ringMove 9s linear infinite;
}

.core-particle {
    position:absolute;
    width:3px;
    height:3px;
    border-radius:50%;
    background:white;
    box-shadow:0 0 8px white;
    animation:particle 5s ease-in-out infinite;
}

.core-particle:nth-child(2) {
    top:25px;
    left:45px;
    animation-delay:-2s;
}

.core-particle:nth-child(3) {
    bottom:30px;
    right:38px;
    animation-delay:-3s;
}

.core-particle:nth-child(4) {
    top:65px;
    right:12px;
    animation-delay:-1s;
}

@keyframes glow {
    0%,100% {transform:scale(.9);opacity:.6}
    50% {transform:scale(1.12);opacity:1}
}

@keyframes coreBreath {
    0%,100% {transform:scale(.96);filter:brightness(.95)}
    50% {transform:scale(1.04);filter:brightness(1.15)}
}

@keyframes rotateCore {
    to {transform:rotate(360deg)}
}

@keyframes ringMove {
    to {transform:rotateX(65deg) rotate(360deg)}
}

@keyframes particle {
    0%,100% {transform:translate(0,0);opacity:.3}
    50% {transform:translate(9px,-12px);opacity:1}
}

.welcome-title {
    font-size:27px;
    font-weight:600;
    letter-spacing:4px;
    margin-bottom:12px;
}

.welcome-sub {
    font-size:13px;
    color:#858585;
    line-height:1.7;
    max-width:300px;
}

/* MESSAGES */

.messages {
    flex:1;
    overflow-y:auto;
    padding:25px max(20px, calc((100% - 760px)/2));
    display:none;
    flex-direction:column;
    gap:22px;
    scroll-behavior:smooth;
}

.message {
    display:flex;
    gap:12px;
    align-items:flex-start;
    max-width:100%;
}

.message.user {
    flex-direction:row-reverse;
}

.message-avatar {
    width:30px;
    height:30px;
    min-width:30px;
    border-radius:50%;
    background:#202020;
    display:grid;
    place-items:center;
    font-size:10px;
    border:1px solid var(--border);
}

.message-content {
    max-width:min(80%,650px);
    font-size:14px;
    line-height:1.75;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.message.user .message-content {
    background:#1c1c1c;
    border:1px solid var(--border);
    padding:12px 15px;
    border-radius:15px 4px 15px 15px;
}

.message.assistant .message-content {
    padding:5px 0;
}

.message-time {
    font-size:10px;
    color:#666;
    margin-top:7px;
}

/* THINKING */

.typing {
    display:flex;
    gap:5px;
    padding:12px 0;
}

.typing span {
    width:5px;
    height:5px;
    background:#ddd;
    border-radius:50%;
    animation:typing 1s infinite alternate;
}

.typing span:nth-child(2) {animation-delay:.2s}
.typing span:nth-child(3) {animation-delay:.4s}

@keyframes typing {
    to {opacity:.2;transform:translateY(-4px)}
}

/* COMPOSER */

.composer-area {
    padding:15px 20px 22px;
    width:100%;
    max-width:820px;
    margin:0 auto;
}

.composer {
    min-height:57px;
    border:1px solid rgba(255,255,255,.15);
    background:#131313;
    border-radius:18px;
    display:flex;
    align-items:flex-end;
    padding:9px 10px;
    gap:8px;
    transition:border .2s,box-shadow .2s;
}

.composer:focus-within {
    border-color:rgba(255,255,255,.4);
    box-shadow:0 0 25px rgba(255,255,255,.04);
}

#messageInput {
    flex:1;
    min-width:0;
    max-height:130px;
    resize:none;
    border:0;
    outline:0;
    background:transparent;
    color:white;
    padding:9px 5px;
    font-size:14px;
    line-height:1.5;
}

#messageInput::placeholder {
    color:#686868;
}

.send-button {
    width:39px;
    height:39px;
    border:0;
    border-radius:12px;
    background:white;
    color:black;
    font-size:18px;
    display:grid;
    place-items:center;
    flex-shrink:0;
}

.send-button:disabled {
    opacity:.35;
    cursor:not-allowed;
}

.tool-button {
    width:39px;
    height:39px;
    border:0;
    border-radius:11px;
    background:transparent;
    color:#aaa;
    font-size:18px;
    display:grid;
    place-items:center;
    flex-shrink:0;
}

.tool-button:hover {
    background:#252525;
    color:white;
}

.disclaimer {
    text-align:center;
    color:#555;
    font-size:10px;
    margin-top:12px;
}

/* SCREEN VIGNETTE */

.screen-vignette {
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:50;
    opacity:0;
    transition:opacity 1s ease;
    box-shadow:
        inset 0 0 65px rgba(255,255,255,.12),
        inset 0 0 140px rgba(255,255,255,.07);
}

body.listening .screen-vignette,
body.speaking .screen-vignette {
    opacity:1;
}

/* SETTINGS */

.modal-backdrop {
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(8px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    z-index:100;
}

.modal-backdrop.open {
    display:flex;
}

.modal {
    width:100%;
    max-width:420px;
    max-height:85dvh;
    overflow-y:auto;
    background:#151515;
    border:1px solid var(--border);
    border-radius:20px;
    padding:22px;
}

.modal-header {
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
}

.modal-header h2 {
    font-size:18px;
}

.modal-close {
    border:0;
    background:transparent;
    color:#aaa;
    font-size:24px;
}

.setting-row {
    padding:15px 0;
    border-bottom:1px solid var(--border);
}

.setting-title {
    font-size:13px;
    margin-bottom:6px;
}

.setting-description {
    font-size:11px;
    color:#777;
    line-height:1.5;
}

.modal-action {
    width:100%;
    padding:12px;
    margin-top:12px;
    border:1px solid var(--border);
    background:#222;
    border-radius:11px;
    color:white;
}

/* MOBILE */

.menu-toggle {
    display:none;
}

@media(max-width:700px) {
    .sidebar {
        position:fixed;
        left:-290px;
        top:0;
        bottom:0;
        width:275px;
        transition:left .25s ease;
        box-shadow:10px 0 40px rgba(0,0,0,.4);
    }

    body.menu-open .sidebar {
        left:0;
    }

    .menu-toggle {
        display:grid;
    }

    .topbar {
        padding:0 13px;
        height:58px;
    }

    .messages {
        padding:20px 14px;
    }

    .composer-area {
        padding:10px 10px 15px;
    }

    .core-wrap {
        transform:scale(.88);
        margin-bottom:18px;
    }

    .welcome-title {
        font-size:23px;
    }

    .message-content {
        font-size:13px;
    }
}

</style>
</head>

<body>

<div class="screen-vignette"></div>

<div class="app">

<aside class="sidebar" id="sidebar">

    <div class="brand">
        <div class="brand-logo"></div>
        <div>
            <div class="brand-name">ENNIE</div>
            <div class="brand-sub">TEHNOCELL AI</div>
        </div>
    </div>

    <button class="new-chat" id="newChatBtn">
        <span>＋</span>
        <span>Новый диалог</span>
    </button>

    <div class="side-label">ИСТОРИЯ</div>

    <div class="history" id="chatHistory"></div>

    <div class="profile">
        <div class="avatar" id="profileAvatar">T</div>
        <div class="profile-info">

        </div>
        <button class="icon-button" id="settingsBtn" aria-label="Настройки">⚙</button>

</aside>

<main class="main">

    <header class="topbar">
        <div style="display:flex;align-items:center;gap:12px">
            <button class="top-button menu-toggle" id="menuToggle">☰</button>
            <div class="top-title">ENNIE <span style="color:#666;font-weight:400">/ AI</span></div>
        </div>

        <div class="top-actions">
            <button class="top-button" id="voiceOutputBtn" aria-label="Голос">◖</button>

        </div>
    </header>

    <section class="welcome" id="welcome">

        <div class="core-wrap" id="coreWrap">
            <div class="core-glow"></div>
            <div class="core-ring"></div>
            <div class="core"></div>
            <div class="core-particle"></div>
            <div class="core-particle"></div>
            <div class="core-particle"></div>
        </div>

        <div class="welcome-title">ENNIE</div>

        <div class="welcome-sub">
            Твой интеллектуальный помощник.<br>
            Готова к работе.
        </div>

    </section>

    <section class="messages" id="messages"></section>

    <div class="composer-area">

        <div class="composer">

            <button class="tool-button" id="attachBtn" aria-label="Прикрепить файл">＋</button>

            <textarea
                id="messageInput"
                rows="1"
                placeholder="Напиши ENNIE..."
            ></textarea>

            <button class="tool-button" id="micBtn" aria-label="Микрофон">⌁</button>

            <button class="send-button" id="sendBtn" aria-label="Отправить">↑</button>

        </div>

        <div class="disclaimer">
            ENNIE — TEHNOCELL AI
        </div>

    </div>

</main>
</div>

<div class="modal-backdrop" id="settingsModal">
    <div class="modal">

        <div class="modal-header">
            <h2>Настройки ENNIE</h2>
            <button class="modal-close" id="closeSettings">×</button>
        </div>

        <div class="setting-row">
            <div class="setting-title">Аккаунт</div>
            <div class="setting-description" id="accountInfo">
                Проверка TEHNOCELL ID...
            </div>
        </div>

        <div class="setting-row">
            <div class="setting-title">Голосовой ответ</div>
            <div class="setting-description">
                Озвучивание ответов ENNIE.
            </div>
        </div>

        <button class="modal-action" id="clearHistoryBtn">
            Удалить историю диалогов
        </button>

        <button class="modal-action" id="logoutBtn">
            Выйти из аккаунта
        </button>

    </div>
</div>
<script>
/* =================================
   ENNIE CORE — CONFIGURATION
================================= */

const SUPABASE_URL = "https://jvagiuiregvlrfooxdao.supabase.co";

const SUPABASE_KEY = "sb_publishable_BIv_yX4jprXgeEpauZyjtA_lr0Weo8X";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

/* =================================
   GLOBAL STATE
================================= */

let currentUser = null;
let currentChatId = null;
let isSending = false;
let voiceEnabled = true;
let recognition = null;
let isListening = false;

const welcome = document.getElementById("welcome");
const messages = document.getElementById("messages");
const chatHistory = document.getElementById("chatHistory");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");

const profileName = document.getElementById("profileName");
const profileStatus = document.getElementById("profileStatus");
const profileAvatar = document.getElementById("profileAvatar");

/* =================================
   HELPERS
================================= */

function showError(message) {
    alert(message);
}

function showWelcome() {
    welcome.style.display = "flex";
    messages.style.display = "none";
}

function showMessages() {
    welcome.style.display = "none";
    messages.style.display = "flex";
}

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[char]);
}

/* =================================
   AUTHENTICATION
================================= */

async function initializeEnnie() {
    profileStatus.textContent = "Проверка аккаунта...";

    try {
        const { data, error } =
            await supabaseClient.auth.getSession();

        if (error) throw error;

        const session = data.session;

        if (!session) {
            profileName.textContent = "TEHNOCELL ID";
            profileStatus.textContent = "Не выполнен вход";

            document.getElementById("accountInfo").textContent =
                "Для работы ENNIE необходимо войти через TEHNOCELL ID.";

            showWelcome();

            showError(
                "Сначала войди в TEHNOCELL ID, затем открой ENNIE снова."
            );

            return;
        }

        currentUser = session.user;

        profileName.textContent =
            currentUser.user_metadata?.display_name ||
            currentUser.email ||
            "TEHNOCELL ID";

        profileStatus.textContent = "Подключено";

        document.getElementById("accountInfo").textContent =
            currentUser.email || "Аккаунт подключён";

        await loadChats();

    } catch (error) {
        console.error("ENNIE AUTH ERROR:", error);

        profileStatus.textContent = "Ошибка подключения";

        showError(
            "Не удалось подключиться к TEHNOCELL ID: " +
            error.message
        );
    }
}

/* Следим за изменениями авторизации */

supabaseClient.auth.onAuthStateChange((event, session) => {
    if (event === "SIGNED_OUT") {
        currentUser = null;
        currentChatId = null;
        chatHistory.innerHTML = "";
        messages.innerHTML = "";
        showWelcome();
        profileStatus.textContent = "Вы вышли";
    }
});
    /* =================================
   CHAT HISTORY
================================= */

async function loadChats() {
    if (!currentUser) return;

    const { data, error } = await supabaseClient
        .from("ennie_chats")
        .select("*")
        .eq("user_id", currentUser.id)
        .order("created_at", { ascending: false });

    if (error) {
        console.error("LOAD CHATS ERROR:", error);
        showError("Не удалось загрузить историю диалогов.");
        return;
    }

    chatHistory.innerHTML = "";

    (data || []).forEach(chat => {
        renderChatItem(chat);
    });
}

/* =================================
   RENDER CHAT ITEM
================================= */

function renderChatItem(chat) {
    const item = document.createElement("div");

    item.className = "history-item";
    item.dataset.id = chat.id;

    if (chat.id === currentChatId) {
        item.classList.add("active");
    }

    const title = document.createElement("span");
    title.className = "history-title";
    title.textContent = chat.title || "Новый диалог";

    const deleteButton = document.createElement("button");
    deleteButton.className = "delete-chat";
    deleteButton.type = "button";
    deleteButton.textContent = "×";
    deleteButton.setAttribute("aria-label", "Удалить диалог");

    deleteButton.addEventListener("click", event => {
        event.stopPropagation();
        deleteChat(chat.id);
    });

    item.appendChild(title);
    item.appendChild(deleteButton);

    item.addEventListener("click", () => {
        openChat(chat.id);
    });

    chatHistory.appendChild(item);
}

/* =================================
   CREATE CHAT
================================= */

async function createChat() {
    if (!currentUser) {
        showError("Сначала войди через TEHNOCELL ID.");
        return null;
    }

    const { data, error } = await supabaseClient
        .from("ennie_chats")
        .insert({
            user_id: currentUser.id,
            title: "Новый диалог"
        })
        .select()
        .single();

    if (error) {
        console.error("CREATE CHAT ERROR:", error);
        showError("Не удалось создать диалог: " + error.message);
        return null;
    }

    currentChatId = data.id;

    messages.innerHTML = "";
    showMessages();

    await loadChats();

    return data;
}

/* =================================
   OPEN CHAT
================================= */

async function openChat(chatId) {
    if (!currentUser) return;

    const { data: chat, error: chatError } = await supabaseClient
        .from("ennie_chats")
        .select("id,title")
        .eq("id", chatId)
        .eq("user_id", currentUser.id)
        .single();

    if (chatError || !chat) {
        console.error("OPEN CHAT ERROR:", chatError);
        showError("Не удалось открыть этот диалог.");
        return;
    }

    currentChatId = chat.id;

    messages.innerHTML = "";
    showMessages();

    const { data, error } = await supabaseClient
        .from("ennie_messages")
        .select("*")
        .eq("chat_id", chatId)
        .eq("user_id", currentUser.id)
        .order("created_at", { ascending: true });

    if (error) {
        console.error("LOAD MESSAGES ERROR:", error);
        showError("Не удалось загрузить сообщения.");
        return;
    }

    (data || []).forEach(message => {
        addMessage(message.role, message.content);
    });

    await loadChats();
}

/* =================================
   DELETE CHAT
================================= */

async function deleteChat(chatId) {
    if (!currentUser) return;

    const confirmed = confirm(
        "Удалить этот диалог и все его сообщения?"
    );

    if (!confirmed) return;

    const { error: messagesError } = await supabaseClient
        .from("ennie_messages")
        .delete()
        .eq("chat_id", chatId)
        .eq("user_id", currentUser.id);

    if (messagesError) {
        console.error("DELETE MESSAGES ERROR:", messagesError);
        showError("Не удалось удалить сообщения: " + messagesError.message);
        return;
    }

    const { error: chatError } = await supabaseClient
        .from("ennie_chats")
        .delete()
        .eq("id", chatId)
        .eq("user_id", currentUser.id);

    if (chatError) {
        console.error("DELETE CHAT ERROR:", chatError);
        showError("Не удалось удалить диалог: " + chatError.message);
        return;
    }

    if (currentChatId === chatId) {
        currentChatId = null;
        messages.innerHTML = "";
        showWelcome();
    }

    await loadChats();
}

   NEW CHAT BUTTON
================================= */

document.getElementById("newChatBtn").addEventListener("click", async () => {

    document.body.classList.remove("menu-open");

================================= */

document.getElementById("menuToggle").addEventListener("click", () => {

/* Закрываем боковое меню при нажатии на основную область */

    /* =================================
   MESSAGE DISPLAY
================================= */

function addMessage(role, content) {
    const message = document.createElement("div");

    message.className = "message " +
        (role === "user" ? "user" : "assistant");

    const avatar = document.createElement("div");
    avatar.className = "message-avatar";
    avatar.textContent = role === "user" ? "T" : "E";

    const messageContent = document.createElement("div");
    messageContent.className = "message-content";

    messageContent.textContent = content;

    message.appendChild(avatar);
    message.appendChild(messageContent);

    messages.appendChild(message);

    messages.scrollTop = messages.scrollHeight;

    return message;
}

/* =================================
   SAVE MESSAGE
================================= */

async function saveMessage(role, content) {
    if (!currentUser || !currentChatId) {
        throw new Error("Нет активного аккаунта или диалога.");
    }

    const { error } = await supabaseClient
        .from("ennie_messages")
        .insert({
            chat_id: currentChatId,
            user_id: currentUser.id,
            role: role,
            content: content
        });

    if (error) {
        console.error("SAVE MESSAGE ERROR:", error);
        throw error;
    }
}

/* =================================
   UPDATE CHAT TITLE
================================= */

async function updateChatTitle(text) {
    if (!currentChatId || !currentUser) return;

    const title = text.length > 35
        ? text.slice(0, 35) + "..."
        : text;

    const { error } = await supabaseClient
        .from("ennie_chats")
        .update({ title: title })
        .eq("id", currentChatId)
        .eq("user_id", currentUser.id);

    if (error) {
        console.error("UPDATE TITLE ERROR:", error);
    }

    await loadChats();
}

/* =================================
   THINKING INDICATOR
================================= */

function showThinking() {
    const element = document.createElement("div");

    element.className = "message assistant";
    element.id = "thinkingIndicator";

    element.innerHTML = `
        <div class="message-avatar">E</div>
        <div class="message-content">
            <div class="typing">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    `;

    messages.appendChild(element);
    messages.scrollTop = messages.scrollHeight;
}

function hideThinking() {
    const element = document.getElementById("thinkingIndicator");

    if (element) {
        element.remove();
    }
}

/* =================================
   SEND MESSAGE
================================= */

async function sendMessage() {
    if (isSending) return;

    const text = messageInput.value.trim();

    if (!text) return;

    if (!currentUser) {
        showError("Сначала войди через TEHNOCELL ID.");
        return;
    }

    isSending = true;
    sendBtn.disabled = true;

    messageInput.value = "";
    messageInput.style.height = "auto";

    try {
        /* Создаём новый чат, если он ещё не выбран */

        if (!currentChatId) {
            const chat = await createChat();

            if (!chat) {
                throw new Error("Не удалось создать диалог.");
            }
        }

        showMessages();

        /* Показываем сообщение пользователя */

        addMessage("user", text);

        /* Сохраняем сообщение */

        await saveMessage("user", text);

        /* Обновляем название первого диалога */

        const { count, error: countError } = await supabaseClient
            .from("ennie_messages")
            .select("*", { count: "exact", head: true })
            .eq("chat_id", currentChatId)
            .eq("user_id", currentUser.id);

        if (!countError && count === 1) {
            await updateChatTitle(text);
        }

        /* Получаем историю для ENNIE CORE V8 */

        const { data: previousMessages, error: historyError } =
            await supabaseClient
                .from("ennie_messages")
                .select("role,content")
                .eq("chat_id", currentChatId)
                .eq("user_id", currentUser.id)
                .order("created_at", { ascending: true });

        if (historyError) throw historyError;

        showThinking();

        /* Отправляем запрос в существующую Edge Function */

        const { data, error } = await supabaseClient.functions.invoke(
            "ennie-core-v8",
            {
                body: {
                    messages: previousMessages || []
                }
            }
        );

        hideThinking();

        if (error) {
            console.error("ENNIE CORE ERROR:", error);
            throw new Error(error.message || "Ошибка ENNIE CORE V8.");
        }

        if (!data || data.success !== true || !data.answer) {
            throw new Error(
                data?.error || "ENNIE не вернула ответ."
            );
        }

        const answer = data.answer;

        /* Показываем ответ ENNIE */

        addMessage("assistant", answer);

        /* Сохраняем ответ */

        await saveMessage("assistant", answer);

        await loadChats();

        /* Озвучивание будет подключено в части 6 */

        if (voiceEnabled && typeof speakText === "function") {
            speakText(answer);
        }

    } catch (error) {
        hideThinking();

        console.error("SEND MESSAGE ERROR:", error);

        addMessage(
            "assistant",
            "Не удалось получить ответ: " + error.message
        );

    } finally {
        isSending = false;
        sendBtn.disabled = false;
        messageInput.focus();
    }
}
    /* =================================
   FISH AUDIO VOICE OUTPUT
================================= */

let ennieAudio = null;

async function speakText(text) {
    if (!text) return;

    try {
        if (ennieAudio) {
            ennieAudio.pause();
            URL.revokeObjectURL(ennieAudio.src);
            ennieAudio = null;
        }

        document.body.classList.add("speaking");

        const { data: sessionData, error: sessionError } =
            await supabase.auth.getSession();

        if (sessionError) throw sessionError;

        const session = sessionData.session;

        if (!session) {
            throw new Error("Необходим вход в TEHNOCELL ID.");
        }

        const response = await fetch(
            `${supabase.supabaseUrl}/functions/v1/ennie-voice`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "apikey": supabase.supabaseKey,
                    "Authorization": `Bearer ${session.access_token}`
                },
                body: JSON.stringify({ text })
            }
        );

        if (!response.ok) {
            throw new Error(await response.text());
        }

        const audioBlob = await response.blob();
        const audioUrl = URL.createObjectURL(audioBlob);

        ennieAudio = new Audio(audioUrl);

        ennieAudio.onended = () => {
            document.body.classList.remove("speaking");
            URL.revokeObjectURL(audioUrl);
        };

        ennieAudio.onerror = () => {
            document.body.classList.remove("speaking");
            URL.revokeObjectURL(audioUrl);
            console.error("ENNIE AUDIO PLAYBACK ERROR");
        };

        await ennieAudio.play();

    } catch (error) {
        document.body.classList.remove("speaking");
        console.error("ENNIE VOICE ERROR:", error);
    }
}

/* =================================
   VOICE INPUT
================================= */

function setupVoiceRecognition() {
    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    const micBtn = document.getElementById("micBtn");

    if (!SpeechRecognition) {
        micBtn.addEventListener("click", () => {
            showError("Голосовой ввод не поддерживается этим браузером.");
        });
        return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = "ru-RU";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = () => {
        isListening = true;
        document.body.classList.add("listening");
        micBtn.style.color = "white";
    };

    recognition.onresult = event => {
        const result = event.results[0][0].transcript;
        messageInput.value = result;
        messageInput.focus();
        messageInput.dispatchEvent(new Event("input"));
    };

    recognition.onerror = event => {
        console.error("VOICE ERROR:", event.error);
    };

    recognition.onend = () => {
        isListening = false;
        document.body.classList.remove("listening");
        micBtn.style.color = "";
    };

    micBtn.addEventListener("click", () => {
        if (isListening) {
            recognition.stop();
        } else {
            try {
                recognition.start();
            } catch (error) {
                console.error(error);
            }
        }
    });
}

================================= */

document.getElementById("voiceOutputBtn")

        voiceEnabled = !voiceEnabled;

            window.speechSynthesis.cancel();
            document.body.classList.remove("speaking");
        }

        document.getElementById("voiceOutputBtn").style.color =
            voiceEnabled ? "white" : "#666";
    });

/* =================================
   CLEAR CHAT HISTORY
================================= */

document.getElementById("clearHistoryBtn")
    .addEventListener("click", async () => {

        if (!currentUser) return;

        const confirmed = confirm(
            "Удалить ВСЮ историю диалогов? Это действие нельзя отменить."
        );

        if (!confirmed) return;

        const { data: chats, error: loadError } = await supabaseClient
            .from("ennie_chats")
            .select("id")
            .eq("user_id", currentUser.id);

        if (loadError) {
            showError("Не удалось получить список диалогов.");
            return;
        }

        for (const chat of (chats || [])) {
            const { error: messageError } = await supabaseClient
                .from("ennie_messages")
                .delete()
                .eq("chat_id", chat.id)
                .eq("user_id", currentUser.id);

            if (messageError) {
                showError("Не удалось удалить сообщения: " + messageError.message);
                return;
            }
        }

        const { error: deleteError } = await supabaseClient
            .from("ennie_chats")
            .delete()
            .eq("user_id", currentUser.id);

        if (deleteError) {
            showError("Не удалось удалить историю: " + deleteError.message);
            return;
        }

        currentChatId = null;
        messages.innerHTML = "";

        showWelcome();
        await loadChats();

        closeSettings();
    });

/* =================================
   LOGOUT
================================= */

document.getElementById("logoutBtn")
    .addEventListener("click", async () => {

        const confirmed = confirm("Выйти из TEHNOCELL ID?");

        if (!confirmed) return;

        const { error } = await supabaseClient.auth.signOut();

        if (error) {
            showError("Не удалось выйти: " + error.message);
            return;
        }

        location.reload();
    });

/* =================================
   MESSAGE INPUT
================================= */

sendBtn.addEventListener("click", sendMessage);

messageInput.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();

});

messageInput.addEventListener("input", () => {

        Math.min(messageInput.scrollHeight, 130) + "px";

================================= */
