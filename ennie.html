<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">

<title>ENNIE — TEHNOCELL AI</title>

<style>
:root {
    --bg: #080808;
    --panel: #111111;
    --panel2: #191919;
    --text: #ffffff;
    --muted: #888888;
    --border: rgba(255,255,255,.09);
    --accent: #ffffff;
}

body.light {
    --bg: #f5f5f5;
    --panel: #ffffff;
    --panel2: #eeeeee;
    --text: #111111;
    --muted: #777777;
    --border: rgba(0,0,0,.09);
    --accent: #111111;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: Inter, Arial, sans-serif;
    height: 100dvh;
    overflow: hidden;
    transition: background .25s, color .25s;
}

button {
    border: none;
    cursor: pointer;
    color: inherit;
    font: inherit;
    background: none;
    -webkit-tap-highlight-color: transparent;
}

.app {
    display: flex;
    width: 100%;
    height: 100dvh;
}

/* SIDEBAR */

.sidebar {
    width: 280px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 20px 14px;
    transition: transform .25s;
    z-index: 10;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 8px 25px;
}

.brand-mark {
    width: 34px;
    height: 34px;
    border: 1px solid var(--text);
    border-radius: 50%;
    position: relative;
    display: grid;
    place-items: center;
}

.brand-mark::after {
    content: "";
    width: 13px;
    height: 13px;
    background: var(--text);
    border-radius: 50%;
    box-shadow: 0 0 14px var(--text);
}

.brand-name {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 2px;
}

.brand-sub {
    color: var(--muted);
    font-size: 9px;
    letter-spacing: 2px;
    margin-top: 3px;
}

.new-chat {
    width: 100%;
    padding: 13px;
    border: 1px solid var(--border);
    border-radius: 12px;
    text-align: left;
    background: var(--panel2);
    font-size: 14px;
    margin-bottom: 22px;
}

.section-label {
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 1.5px;
    padding: 0 9px 12px;
}

.history {
    flex: 1;
    overflow-y: auto;
}

.history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 11px 9px;
    border-radius: 9px;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 3px;
}

.history-item.active,
.history-item:active {
    background: var(--panel2);
    color: var(--text);
}

.history-title {
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    flex: 1;
    text-align: left;
}

.delete-chat {
    font-size: 18px;
    padding: 2px 6px;
    opacity: .6;
}

.sidebar-bottom {
    border-top: 1px solid var(--border);
    padding-top: 12px;
}

.side-button {
    width: 100%;
    text-align: left;
    padding: 12px 9px;
    border-radius: 9px;
    color: var(--muted);
    font-size: 13px;
}

.side-button:active {
    background: var(--panel2);
    color: var(--text);
}

/* MAIN */

.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    position: relative;
}

.topbar {
    height: 64px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
}

.top-left,
.top-right {
    display: flex;
    align-items: center;
    gap: 13px;
}

.icon-button {
    width: 39px;
    height: 39px;
    border-radius: 11px;
    display: grid;
    place-items: center;
    font-size: 19px;
}

.icon-button:active {
    background: var(--panel2);
}

.top-title {
    font-size: 14px;
    font-weight: 600;
}

.status {
    color: var(--muted);
    font-size: 11px;
    margin-top: 3px;
}

/* CHAT */

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 30px;
    display: flex;
    flex-direction: column;
}

.welcome {
    margin: auto;
    text-align: center;
    width: 100%;
    max-width: 430px;
    padding: 25px 10px;
}

.orb {
    width: 112px;
    height: 112px;
    margin: 0 auto 30px;
    border-radius: 50%;
    position: relative;
    background:
        radial-gradient(circle at 35% 30%,
        #ffffff 0%,
        #eeeeee 13%,
        #aaaaaa 35%,
        #555555 58%,
        #111111 78%);
    box-shadow:
        0 0 35px rgba(255,255,255,.18),
        0 0 90px rgba(255,255,255,.07),
        inset -12px -15px 30px rgba(0,0,0,.65);
    animation: float 5s ease-in-out infinite;
    transition: transform .3s, box-shadow .3s;
}

.orb::after {
    content: "";
    position: absolute;
    inset: -12px;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 50%;
    animation: pulse 3s ease-in-out infinite;
}

.orb.thinking {
    animation: thinking 1.3s ease-in-out infinite;
}

@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-9px); }
}

@keyframes pulse {
    0%,100% { transform: scale(.96); opacity: .25; }
    50% { transform: scale(1.13); opacity: .8; }
}

@keyframes thinking {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.12); }
}

.welcome h1 {
    font-size: 27px;
    font-weight: 600;
    margin-bottom: 12px;
}

.welcome p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
}

/* MESSAGES */

.message {
    width: 100%;
    max-width: 760px;
    margin: 0 auto 22px;
    display: flex;
    gap: 12px;
    animation: appear .25s ease;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(7px); }
    to { opacity: 1; transform: translateY(0); }
}

.message-avatar {
    width: 30px;
    height: 30px;
    flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid var(--border);
    display: grid;
    place-items: center;
    font-size: 11px;
}

.message-content {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    padding-top: 4px;
}

.message-name {
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 5px;
}

/* COMPOSER */

.composer-area {
    padding: 12px 16px max(15px, env(safe-area-inset-bottom));
    background: var(--bg);
}

.composer {
    max-width: 760px;
    margin: auto;
    min-height: 55px;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 17px;
}

.composer textarea {
    flex: 1;
    min-width: 0;
    resize: none;
    max-height: 130px;
    min-height: 36px;
    padding: 10px 7px;
    color: var(--text);
    background: transparent;
    border: none;
    outline: none;
    font: inherit;
    font-size: 14px;
}

.composer textarea::placeholder {
    color: var(--muted);
}

.send-button {
    width: 39px;
    height: 39px;
    flex-shrink: 0;
    border-radius: 12px;
    background: var(--text);
    color: var(--bg);
    font-size: 17px;
}

.send-button:disabled {
    opacity: .35;
}

.composer-note {
    text-align: center;
    color: var(--muted);
    font-size: 10px;
    margin-top: 10px;
}

/* MOBILE */

.mobile-only {
    display: none;
}

.overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 9;
}

@media(max-width:700px) {
    .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: min(290px, 85vw);
        transform: translateX(-105%);
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .overlay.show {
        display: block;
    }

    .mobile-only {
        display: grid;
    }

    .topbar {
        padding: 0 12px;
    }

    .chat {
        padding: 14px 13px 25px;
    }

    .welcome h1 {
        font-size: 24px;
    }

    .orb {
        width: 95px;
        height: 95px;
    }

    .composer-area {
        padding-left: 10px;
        padding-right: 10px;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar" id="sidebar">

        <div class="brand">
            <div class="brand-mark"></div>
            <div>
                <div class="brand-name">ENNIE</div>
                <div class="brand-sub">TEHNOCELL AI</div>
            </div>
        </div>

        <button class="new-chat" id="newChat">
            + Новый диалог
        </button>

        <div class="section-label">ИСТОРИЯ</div>

        <div class="history" id="history">
        </div>

        <div class="sidebar-bottom">
            <button class="side-button" id="clearHistory">
                Очистить историю
            </button>

            <button class="side-button" id="settingsButton">
                Настройки
            </button>

            <button class="side-button" id="profileButton">
                TEHNOCELL ID
            </button>
        </div>

    </aside>

    <div class="overlay" id="overlay"></div>

    <main class="main">

        <header class="topbar">

            <div class="top-left">
                <button class="icon-button mobile-only" id="menuButton">
                    ☰
                </button>

                <div>
                    <div class="top-title">ENNIE</div>
                    <div class="status" id="connectionStatus">
                        Подключение...
                    </div>
                </div>
            </div>

            <div class="top-right">
                <button class="icon-button" id="themeButton">
                    ◐
                </button>
            </div>

        </header>

        <section class="chat" id="chat">

            <div class="welcome" id="welcome">
                <div class="orb" id="orb"></div>

                <h1>Я здесь.</h1>

                <p>
                    Можешь рассказать мне о своём дне,
                    задать вопрос или просто поговорить.
                </p>
            </div>

        </section>

        <div class="composer-area">

            <div class="composer" id="composer">

                <textarea
                    id="messageInput"
                    placeholder="Напиши ENNIE..."
                    rows="1"
                ></textarea>

                <button class="send-button" id="sendButton">
                    ↑
                </button>

            </div>

            <div class="composer-note">
                ENNIE — искусственный интеллект TEHNOCELL
            </div>

        </div>

    </main>

</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
"use strict";

/* =================================
   SUPABASE
================================= */

const SUPABASE_URL = "https://jvagiuiregvlrfooxdao.supabase.co";

const SUPABASE_KEY = "sb_publishable_BIv_yX4jprXgeEpauZyjtA_lr0Weo8X";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

/* =================================
   ELEMENTS
================================= */

const $ = id => document.getElementById(id);

const sidebar = $("sidebar");
const overlay = $("overlay");
const chat = $("chat");
const historyBox = $("history");
const input = $("messageInput");
const sendButton = $("sendButton");
const orb = $("orb");
const welcome = $("welcome");
const statusText = $("connectionStatus");

/* =================================
   STATE
================================= */

let currentUser = null;
let currentChatId = null;
let isSending = false;
let chats = [];
let messages = [];

/* =================================
   STATUS
================================= */

function setStatus(text) {
    statusText.textContent = text;
}

/* =================================
   MOBILE MENU
================================= */

function closeMenu() {
    sidebar.classList.remove("open");
    overlay.classList.remove("show");
}

$("menuButton").addEventListener("click", () => {
    sidebar.classList.toggle("open");
    overlay.classList.toggle("show");
});

overlay.addEventListener("click", closeMenu);

/* =================================
   THEME
================================= */

function applyTheme(theme) {
    document.body.classList.toggle("light", theme === "light");

    localStorage.setItem("ennie-theme", theme);
}

const savedTheme = localStorage.getItem("ennie-theme") || "dark";

applyTheme(savedTheme);

$("themeButton").addEventListener("click", () => {
    const newTheme = document.body.classList.contains("light")
        ? "dark"
        : "light";

    applyTheme(newTheme);
});

/* =================================
   PROFILE
================================= */

$("profileButton").addEventListener("click", () => {
    window.location.href = "account.html";
});

/* =================================
   CHAT DISPLAY
================================= */

function showWelcome() {
    welcome.style.display = "block";
    messages = [];
    currentChatId = null;

    chat.querySelectorAll(".message").forEach(el => el.remove());
}

function addMessage(role, content) {
    welcome.style.display = "none";

    const message = document.createElement("div");
    message.className = "message";

    const avatar = document.createElement("div");
    avatar.className = "message-avatar";
    avatar.textContent = role === "user" ? "Я" : "E";

    const body = document.createElement("div");
    body.className = "message-content";

    const name = document.createElement("div");
    name.className = "message-name";
    name.textContent = role === "user" ? "Вы" : "ENNIE";

    const text = document.createElement("div");
    text.textContent = content;

    body.appendChild(name);
    body.appendChild(text);

    message.appendChild(avatar);
    message.appendChild(body);

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;

    return message;
}

/* =================================
   CHAT HISTORY
================================= */

function renderHistory() {
    historyBox.innerHTML = "";

    chats.forEach(item => {
        const row = document.createElement("div");
        row.className = "history-item";

        if (item.id === currentChatId) {
            row.classList.add("active");
        }

        const title = document.createElement("button");
        title.className = "history-title";
        title.textContent = item.title || "Новый диалог";

        title.addEventListener("click", () => {
            openChat(item.id);
            closeMenu();
        });

        const remove = document.createElement("button");
        remove.className = "delete-chat";
        remove.textContent = "×";
        remove.title = "Удалить диалог";

        remove.addEventListener("click", event => {
            event.stopPropagation();
            deleteChat(item.id);
        });

        row.appendChild(title);
        row.appendChild(remove);

        historyBox.appendChild(row);
    });
}

/* =================================
   LOAD CHATS
================================= */

async function loadChats() {
    if (!currentUser) return;

    const { data, error } = await db
        .from("ennie_chats")
        .select("*")
        .eq("user_id", currentUser.id)
        .order("created_at", { ascending: false });

    if (error) {
        console.error("Ошибка загрузки диалогов:", error);
        setStatus("Ошибка загрузки истории");
        return;
    }

    chats = data || [];

    renderHistory();
}

/* =================================
   CREATE CHAT
================================= */

async function createChat() {
    if (!currentUser) {
        alert("Сначала войди через TEHNOCELL ID.");
        return null;
    }

    const { data, error } = await db
        .from("ennie_chats")
        .insert({
            user_id: currentUser.id,
            title: "Новый диалог"
        })
        .select()
        .single();

    if (error) {
        console.error("Ошибка создания диалога:", error);
        alert("Не удалось создать диалог: " + error.message);
        return null;
    }

    chats.unshift(data);

    currentChatId = data.id;
    messages = [];

    renderHistory();
    showWelcome();

    return data.id;
}

/* =================================
   OPEN CHAT
================================= */

async function openChat(id) {
    if (!currentUser) return;

    const { data, error } = await db
        .from("ennie_messages")
        .select("*")
        .eq("chat_id", id)
        .order("created_at", { ascending: true });

    if (error) {
        console.error("Ошибка открытия диалога:", error);
        alert("Не удалось открыть диалог.");
        return;
    }

    currentChatId = id;
    messages = [];

    chat.querySelectorAll(".message").forEach(el => el.remove());

    welcome.style.display = "none";

    (data || []).forEach(item => {
        messages.push({
            role: item.role,
            content: item.content
        });

        addMessage(item.role, item.content);
    });

    if (!data || data.length === 0) {
        welcome.style.display = "block";
    }

    renderHistory();
    chat.scrollTop = chat.scrollHeight;
}

/* =================================
   DELETE CHAT
================================= */

async function deleteChat(id) {
    if (!confirm("Удалить этот диалог?")) return;

    const { error: messageError } = await db
        .from("ennie_messages")
        .delete()
        .eq("chat_id", id);

    if (messageError) {
        alert("Не удалось удалить сообщения.");
        console.error(messageError);
        return;
    }

    const { error: chatError } = await db
        .from("ennie_chats")
        .delete()
        .eq("id", id)
        .eq("user_id", currentUser.id);

    if (chatError) {
        alert("Не удалось удалить диалог.");
        console.error(chatError);
        return;
    }

    chats = chats.filter(item => item.id !== id);

    if (currentChatId === id) {
        showWelcome();
    }

    renderHistory();
}

/* =================================
   CLEAR HISTORY
================================= */

$("clearHistory").addEventListener("click", async () => {
    if (!currentUser) return;

    if (!confirm("Удалить всю историю диалогов?")) return;

    for (const item of [...chats]) {
        const { error } = await db
            .from("ennie_messages")
            .delete()
            .eq("chat_id", item.id);

        if (error) {
            alert("Не удалось очистить историю.");
            console.error(error);
            return;
        }

        const { error: chatError } = await db
            .from("ennie_chats")
            .delete()
            .eq("id", item.id)
            .eq("user_id", currentUser.id);

        if (chatError) {
            alert("Не удалось удалить все диалоги.");
            console.error(chatError);
            return;
        }
    }

    chats = [];
    showWelcome();
    renderHistory();

    alert("История диалогов очищена.");
});

/* =================================
   NEW CHAT
================================= */

$("newChat").addEventListener("click", async () => {
    showWelcome();
    currentChatId = null;
    closeMenu();
});

/* =================================
   SETTINGS
================================= */

$("settingsButton").addEventListener("click", () => {
    alert(
        "Настройки ENNIE\n\n" +
        "Тема оформления — кнопка в верхней панели.\n" +
        "Голосовые функции будут подключены отдельно."
    );
});

/* =================================
   INPUT
================================= */

input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 130) + "px";
});

input.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
    }
});

/* =================================
   DATABASE SAVE
================================= */

async function saveMessage(role, content) {
    const { error } = await db
        .from("ennie_messages")
        .insert({
            chat_id: currentChatId,
            user_id: currentUser.id,
            role: role,
            content: content
        });

    if (error) {
        throw error;
    }
}

/* =================================
   INITIALIZATION
================================= */

async function initializeEnnie() {
    try {
        setStatus("Проверка авторизации...");

        const { data, error } = await db.auth.getSession();

        if (error) throw error;

        const session = data.session;

        if (!session) {
            setStatus("Необходим вход");

            alert("Сначала войди через TEHNOCELL ID.");

            return;
        }

        currentUser = session.user;

        setStatus("Подключено");

        await loadChats();

    } catch (error) {
        console.error("ENNIE initialization error:", error);
        setStatus("Ошибка подключения");
    }
}

/* =================================
   AUTH CHANGES
================================= */

db.auth.onAuthStateChange((event, session) => {
    if (session && session.user) {
        currentUser = session.user;
    } else {
        currentUser = null;
        chats = [];
        messages = [];
        renderHistory();
        setStatus("Необходим вход");
    }
});

/* =================================
   START
================================= */

initializeEnnie();

</script>
<script>

/* =================================
   SAVE CHAT TITLE
================================= */

async function updateChatTitle(text) {
    if (!currentChatId) return;

    const title = text.length > 35
        ? text.substring(0, 35) + "..."
        : text;

    const { error } = await db
        .from("ennie_chats")
        .update({ title })
        .eq("id", currentChatId)
        .eq("user_id", currentUser.id);

    if (error) {
        console.error("Ошибка названия диалога:", error);
        return;
    }

    const item = chats.find(c => c.id === currentChatId);

    if (item) item.title = title;

    renderHistory();
}

/* =================================
   TYPING INDICATOR
================================= */

function showTyping() {
    const element = document.createElement("div");

    element.className = "message";
    element.id = "typingIndicator";

    element.innerHTML = `
        <div class="message-avatar">E</div>
        <div class="message-content">
            <div class="message-name">ENNIE</div>
            <div>Думаю...</div>
        </div>
    `;

    chat.appendChild(element);
    chat.scrollTop = chat.scrollHeight;

    orb.classList.add("thinking");
}

function hideTyping() {
    const element = $("typingIndicator");

    if (element) element.remove();

    orb.classList.remove("thinking");
}

/* =================================
   SEND MESSAGE
================================= */

async function sendMessage() {

    if (isSending) return;

    const text = input.value.trim();

    if (!text) return;

    if (!currentUser) {
        alert("Сначала войди через TEHNOCELL ID.");
        return;
    }

    isSending = true;
    sendButton.disabled = true;

    input.value = "";
    input.style.height = "auto";

    try {

        if (!currentChatId) {
            const id = await createChat();

            if (!id) {
                throw new Error("Не удалось создать диалог.");
            }

            await updateChatTitle(text);
        }

        addMessage("user", text);

        messages.push({
            role: "user",
            content: text
        });

        await saveMessage("user", text);

        showTyping();

        const { data, error } = await db.functions.invoke(
            "ennie-core-v8",
            {
                body: {
                    messages: messages
                }
            }
        );

        hideTyping();

        if (error) {
            console.error("ENNIE API error:", error);
            throw new Error("Ошибка соединения с ENNIE CORE V8.");
        }

        if (!data || data.success !== true || !data.answer) {
            throw new Error(
                data?.error || "ENNIE не вернула ответ."
            );
        }

        const answer = data.answer;

        messages.push({
            role: "assistant",
            content: answer
        });

        addMessage("assistant", answer);

        await saveMessage("assistant", answer);

        setStatus("На связи");

        if (messages.length === 2) {
            await loadChats();
        }

    } catch (error) {

        hideTyping();

        console.error("SEND ERROR:", error);

        addMessage(
            "assistant",
            "Не получилось отправить сообщение. " +
            error.message
        );

        setStatus("Ошибка");

    } finally {

        isSending = false;
        sendButton.disabled = false;
        input.focus();

    }
}

/* =================================
   SEND BUTTON
================================= */

sendButton.addEventListener("click", sendMessage);

/* =================================
   VOICE INPUT
================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

if (SpeechRecognition) {

    recognition = new SpeechRecognition();

    recognition.lang = "ru-RU";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onresult = event => {

        const result = event.results[0][0].transcript;

        input.value = result;

        input.dispatchEvent(new Event("input"));

    };

    recognition.onerror = event => {
        console.error("Voice error:", event.error);
        alert("Не удалось распознать речь.");
    };

}

const voiceButton = document.createElement("button");

voiceButton.className = "icon-button";
voiceButton.type = "button";
voiceButton.textContent = "Микрофон";
voiceButton.title = "Голосовой ввод";

voiceButton.style.width = "auto";
voiceButton.style.fontSize = "11px";
voiceButton.style.padding = "0 8px";

$("composer").insertBefore(
    voiceButton,
    $("messageInput")
);

voiceButton.addEventListener("click", () => {

    if (!recognition) {
        alert("Голосовой ввод не поддерживается этим браузером.");
        return;
    }

    try {
        recognition.start();
    } catch (error) {
        console.error(error);
    }

});

/* =================================
   VOICE OUTPUT
================================= */

function speakEnnie(text) {

    if (!("speechSynthesis" in window)) {
        alert("Озвучивание не поддерживается.");
        return;
    }

    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);

    utterance.lang = "ru-RU";
    utterance.rate = 0.96;
    utterance.pitch = 1.08;

    window.speechSynthesis.speak(utterance);
}

/* =================================
   LONG PRESS NOT REQUIRED
================================= */

console.log("ENNIE V9 interface initialized.");
